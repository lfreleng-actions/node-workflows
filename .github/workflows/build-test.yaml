---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Node.js build/test pipeline.
#
# Reproduces the canonical Linux Foundation pipeline shape. The
# repository-metadata job runs in parallel as an informational step;
# node-metadata resolves the effective Node.js version and build tool
# (explicit inputs win, then package.json detection, then defaults).
# After build the jobs in { } run in parallel; none gates another, so a
# PR surfaces every failure (-> denotes sequence). Lint reads only the
# source, so it runs beside the build:
#   node-metadata -> build -> { tests | audit | sbom -> grype }
#   node-metadata -> lint
#
# Call this from a thin caller workflow; see examples/build-test/ for
# both a plain GitHub-native caller and a Gerrit-wrapped caller.
name: '[R] Node.js Build/Test'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: >-
          Branch/tag/SHA to check out. Empty uses the triggering
          event's ref for same-repository checkouts, or the default
          branch when checking out a different repository.
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Node.js toolchain ---
      node_version:
        description: >-
          Node.js version to use. Empty (the default) auto-detects a
          plain engines.node version from package.json and otherwise
          falls back to the current default (22).
        required: false
        type: string
        default: ''
      build_node_version:
        description: >-
          Node.js version for jobs that run the project's own
          toolchain. Empty (the default) follows node_version. Set
          this when a legacy dependency tree caps the build below the
          version the pack/publish jobs need.
        required: false
        type: string
        default: ''
      test_node_version:
        description: >-
          Node.js version for the test job. Empty (the default)
          follows node_version. Projects needing build_node_version
          often test on a newer toolchain than they build on.
        required: false
        type: string
        default: ''
      test_node_versions:
        description: >-
          Node.js versions to run the tests job on, one leg each: a
          JSON array such as '["20", "22", "24"]', or a comma, space
          or newline separated list (at most 10). Empty (the default)
          runs one leg on test_node_version. Set one or the other.
        required: false
        type: string
        default: ''
      build_tool:
        description: >-
          Package manager: 'npm', 'yarn' (Yarn classic), 'yarn-berry'
          (Yarn 2 and later), 'pnpm' or 'bun'. Empty (the default)
          uses the one detected from package.json and the lockfiles,
          or npm when the project names none; any other value fails.
        required: false
        type: string
        default: ''

      # --- Build ---
      build_scripts:
        description: 'package.json script(s) the build job runs'
        required: false
        type: string
        default: 'build'
      lockfile_required:
        description: >-
          Require the build tool's own lockfile in path_prefix and
          install from it frozen, failing node-metadata without it.
          False installs frozen when that lockfile exists and runs a
          resolving install otherwise.
        required: false
        type: boolean
        default: false

      # --- Tests ---
      tests_enabled:
        description: 'Run the tests job (set false to skip tests)'
        required: false
        type: boolean
        default: true
      test_script:
        description: >-
          package.json script(s) the tests job runs; accepts a comma,
          space or newline separated list
        required: false
        type: string
        default: 'test'
      test_permit_fail:
        description: 'Permit test failures without failing the workflow'
        required: false
        type: boolean
        default: false
      test_artifact_path:
        description: >-
          Path (relative to path_prefix) of test output/reports to
          upload as a workflow artefact; empty disables the upload
        required: false
        type: string
        default: ''
      junit_report_path:
        description: >-
          Glob (relative to path_prefix) of JUnit XML reports to render
          in the tests job summary and upload as node-junit; empty
          disables
        required: false
        type: string
        default: ''
      coverage_path:
        description: >-
          Path (relative to path_prefix) of an lcov.info or istanbul
          coverage-summary.json file, or a directory holding either, to
          summarise in the tests job summary and upload as
          node-coverage; empty disables
        required: false
        type: string
        default: ''
      artifact_suffix:
        description: >-
          Appended to the name of every artefact this call uploads, so
          a run that calls the workflow more than once keeps each
          call's artefacts apart; letters, digits, '.', '_' and '-'
        required: false
        type: string
        default: ''

      # --- Lint ---
      lint_enabled:
        description: >-
          Run the lint job (set false to skip). It runs the project's
          pre-commit hooks through standalone-linting-action, and
          passes with a notice when path_prefix holds no
          .pre-commit-config.yaml.
        required: false
        type: boolean
        default: true
      lint_hooks:
        description: >-
          Space or comma separated hook ids (or aliases) the lint job
          runs. Empty (the default) runs the hooks the configuration
          lists under ci.skip.
        required: false
        type: string
        default: ''
      lint_permit_fail:
        description: 'Permit lint failures without failing the workflow'
        required: false
        type: boolean
        default: false

      # --- Audit ---
      audit_enabled:
        description: 'Run the dependency audit job (set false to skip)'
        required: false
        type: boolean
        default: true
      audit_level:
        description: >-
          npm audit severity threshold that fails the audit: 'info',
          'low', 'moderate', 'high' or 'critical'
          (matches the node-audit-action default)
        required: false
        type: string
        default: 'high'
      production_only:
        description: 'Audit production dependencies only'
        required: false
        type: boolean
        default: false
      audit_permit_fail:
        description: 'Permit dependency audit failures (the NO_BLOCK pattern)'
        required: false
        type: boolean
        default: false

      # --- SBOM/Grype scan ---
      sbom_enabled:
        description: >-
          Generate an SBOM (set false to skip). The Grype scan
          reads the SBOM, so skipping generation leaves it nothing to
          scan. To keep the SBOM but drop the scan, use grype_enabled.
        required: false
        type: boolean
        default: true
      grype_enabled:
        description: >-
          Run the Grype vulnerability scan over the generated SBOM (set
          false to skip). Decoupling is one-way: disabling the scan
          keeps the SBOM, but disabling the SBOM also stops the scan,
          which has nothing to read.
        required: false
        type: boolean
        default: true
      grype_fail_on:
        description: 'Minimum severity that fails the Grype scan'
        required: false
        type: string
        default: 'medium'
      grype_permit_fail:
        description: >-
          Permit Grype findings without failing the job. When false, falls
          back to the NO_BLOCK_AUDIT_FAIL repository variable at runtime.
        required: false
        type: boolean
        default: false
      grype_gate_when:
        description: >-
          When Grype findings block the job: 'always', or
          'dependencies-changed' to report them as warnings unless the
          change under review touched package.json or a lockfile. A
          change the workflow cannot compare against its base keeps
          the gate on.
        required: false
        type: string
        default: 'always'

      # --- Job timeouts ---
      build_timeout_minutes:
        description: 'Timeout (minutes) for the build job'
        required: false
        type: number
        default: 15
      test_timeout_minutes:
        description: 'Timeout (minutes) for the tests and lint jobs'
        required: false
        type: number
        default: 10
      audit_timeout_minutes:
        description: 'Timeout (minutes) for the audit, SBOM and Grype jobs'
        required: false
        type: number
        default: 10

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      build_permit_egress_traffic:
        description: >
          Run harden-runner in audit mode for the build job only,
          permitting unrestricted egress. Use when the build fetches
          dependencies from CDNs that are impractical to enumerate in the
          allow-list. Other jobs stay governed by harden_runner_egress;
          left unset, the build job follows it too.
        required: false
        type: boolean
        default: false
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@084d6861688632b2edb6bde3c180145bebf9cc7a'  # v0.17.2

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Workflow Inputs'
    # Fails fast with a clear message on invalid workflow inputs: the
    # test artefact path, job timeouts, the Grype gate mode, and the
    # Gerrit parameters (when
    # gerrit_refspec is set without the project/branch the Gerrit
    # checkout path also requires). The build-chain root job depends on
    # this, so invalid inputs stop the pipeline early and cleanly. This
    # job always runs (only some validation steps are conditional), so
    # gating dependents on it does not trip GitHub's "skipped need
    # skips dependents" behaviour.
    # The job carries no harden-runner step by design: it performs pure
    # input-string validation with no checkout, artifacts or network
    # access, and loading the egress allow-list would itself add an
    # outbound call.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Validate path_prefix input'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # Require a relative, non-traversing path: later jobs cd
          # into it and derive packaging/publish paths from it, so
          # absolute paths or .. segments could escape the checkout
          # A single trailing slash is tolerated ('./' == '.',
          # 'subdir/' == 'subdir')
          PATH_PREFIX="${PATH_PREFIX%/}"
          if [ "${PATH_PREFIX}" = '.' ]; then
            exit 0
          fi
          if [[ ! "${PATH_PREFIX}" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] \
            || [[ "${PATH_PREFIX}" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid path_prefix input: ${PATH_PREFIX}"
            exit 1
          fi

      - name: 'Validate test_artifact_path input'
        if: inputs.test_artifact_path != ''
        shell: bash
        env:
          TEST_ARTIFACT_PATH: ${{ inputs.test_artifact_path }}
        run: |
          # Require a relative, non-traversing path (the * wildcard
          # permitted): the tests job joins it onto path_prefix for
          # the artefact upload, so absolute paths or .. segments
          # could pull in files from outside the checkout
          valid='^[A-Za-z0-9._*-]+(/[A-Za-z0-9._*-]+)*/?$'
          if [[ ! "${TEST_ARTIFACT_PATH}" =~ ${valid} ]] \
            || [[ "${TEST_ARTIFACT_PATH}" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid test_artifact_path input:" \
              "${TEST_ARTIFACT_PATH}"
            exit 1
          fi

      - name: 'Validate test report path inputs'
        id: validate-report-paths
        if: inputs.junit_report_path != '' || inputs.coverage_path != ''
        shell: bash
        env:
          JUNIT_REPORT_PATH: ${{ inputs.junit_report_path }}
          COVERAGE_PATH: ${{ inputs.coverage_path }}
        run: |
          # The test_artifact_path rules: the tests job joins these
          # onto path_prefix, so absolute paths or .. segments could
          # read or upload files from outside the checkout. Only the
          # JUnit glob takes the * wildcard; coverage_path names one
          # file or directory
          errors=0
          check() {
            local name="$1" value="$2" chars="$3"
            local valid="^[${chars}]+(/[${chars}]+)*/?$"
            if [ -n "${value}" ] && { [[ ! "${value}" =~ ${valid} ]] \
              || [[ "${value}" =~ (^|/)\.\.(/|$) ]]; }; then
              # A newline in the value could forge a workflow command
              echo "::error::Invalid ${name} input:" \
                "$(printf '%s' "${value}" | tr -d '\r\n')"
              errors=1
            fi
          }
          check junit_report_path "${JUNIT_REPORT_PATH}" 'A-Za-z0-9._*-'
          check coverage_path "${COVERAGE_PATH}" 'A-Za-z0-9._-'
          exit "${errors}"

      - name: 'Validate artifact_suffix input'
        if: inputs.artifact_suffix != ''
        shell: bash
        env:
          ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}
        run: |
          # Every upload appends this to its artefact name, so admit
          # only characters artefact names and paths take as they are
          if [[ ! "${ARTIFACT_SUFFIX}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            # A newline in the value could forge a workflow command
            echo "::error::Invalid artifact_suffix input:" \
              "$(printf '%s' "${ARTIFACT_SUFFIX}" | tr -d '\r\n')"
            exit 1
          fi

      - name: 'Validate job timeout inputs'
        shell: bash
        env:
          BUILD_TIMEOUT: ${{ inputs.build_timeout_minutes }}
          TEST_TIMEOUT: ${{ inputs.test_timeout_minutes }}
          AUDIT_TIMEOUT: ${{ inputs.audit_timeout_minutes }}
        run: |
          # Require whole-minute timeouts in the range 1-360 (the
          # GitHub-hosted runner job cap). Values GitHub itself
          # rejects (e.g. fractional numbers) can fail workflow
          # evaluation before this step runs; for values that do
          # reach it (zero, negative or out-of-range), this gives a
          # clear fail-fast error
          error=0
          for entry in \
            "build_timeout_minutes=${BUILD_TIMEOUT}" \
            "test_timeout_minutes=${TEST_TIMEOUT}" \
            "audit_timeout_minutes=${AUDIT_TIMEOUT}"; do
            name="${entry%%=*}"; value="${entry#*=}"
            if [[ ! "${value}" =~ ^[0-9]+$ ]] \
              || [ "${value}" -lt 1 ] || [ "${value}" -gt 360 ]; then
              echo "::error::Invalid ${name} input: ${value}"
              error=1
            fi
          done
          exit "${error}"

      - name: 'Validate grype_gate_when input'
        shell: bash
        env:
          GRYPE_GATE_WHEN: ${{ inputs.grype_gate_when }}
        run: |
          # grype-scan-action rejects other values too, but only after
          # the build and SBOM jobs have run
          case "${GRYPE_GATE_WHEN}" in
            always|dependencies-changed) ;;
            *)
              echo "::error::Invalid grype_gate_when input:" \
                "${GRYPE_GATE_WHEN}"
              exit 1
              ;;
          esac

      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@b2078d32ca207a0e110b2157a95271a35688c8e7  # v0.3.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  node-metadata:
    name: 'Node.js Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.resolve.outputs.node_version }}
      build_tool: ${{ steps.resolve.outputs.build_tool }}
      # yamllint disable-line rule:line-length
      build_node_version: ${{ steps.resolve.outputs.build_node_version }}
      test_matrix: ${{ steps.resolve.outputs.test_matrix }}
      # yamllint disable-line rule:line-length
      audit_package_manager: ${{ steps.resolve.outputs.audit_package_manager }}
      install_mode: ${{ steps.resolve.outputs.install_mode }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Gather Node.js build metadata'
        id: build-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/build-metadata-action@f5788fd76522ba71a079caaa77b7e50d7a7c5d0f  # v0.11.1
        with:
          path_prefix: ${{ inputs.path_prefix }}
          artifact_upload: 'false'

      - name: 'Resolve Node.js version and build tool'
        id: resolve
        shell: bash
        env:
          NODE_VERSION_INPUT: ${{ inputs.node_version }}
          BUILD_NODE_VERSION_INPUT: ${{ inputs.build_node_version }}
          TEST_NODE_VERSION_INPUT: ${{ inputs.test_node_version }}
          TEST_NODE_VERSIONS_INPUT: ${{ inputs.test_node_versions }}
          BUILD_TOOL_INPUT: ${{ inputs.build_tool }}
          PATH_PREFIX: ${{ inputs.path_prefix }}
          LOCKFILE_REQUIRED: ${{ inputs.lockfile_required }}
          # yamllint disable-line rule:line-length
          DETECTED_PACKAGE_MANAGER: ${{ steps.build-metadata.outputs.javascript_package_manager }}
          # yamllint disable-line rule:line-length
          DETECTED_REQUIRES_NODE: ${{ steps.build-metadata.outputs.javascript_requires_node }}
        run: |
          # Resolve the effective Node.js version and build tool:
          # explicit inputs win, then metadata detection, then defaults
          node_version="${NODE_VERSION_INPUT}"
          # Constrain caller input to the character set the downstream
          # setup/audit/publish actions accept, and keep the value safe
          # to write to $GITHUB_OUTPUT
          if [ -n "${node_version}" ] &&
            [[ ! "${node_version}" =~ ^[A-Za-z0-9./*_-]+$ ]]; then
            echo "::error::Invalid node_version input:" \
              "$(printf '%s' "${node_version}" | tr -d '\r\n')"
            exit 1
          fi
          if [ -z "${node_version}" ]; then
            # Use the engines.node constraint when it names a plain
            # version; downstream actions reject range syntax (>=18)
            if [[ "${DETECTED_REQUIRES_NODE}" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]
            then
              node_version="${DETECTED_REQUIRES_NODE}"
            elif [ -n "${DETECTED_REQUIRES_NODE}" ]; then
              echo "::notice::engines.node constraint" \
                "'${DETECTED_REQUIRES_NODE}' is not a plain version;" \
                "using the default Node.js version"
            fi
          fi
          if [ -z "${node_version}" ]; then
            node_version='22'
          fi
          # Detection reports npm, yarn (classic), yarn-berry, pnpm or
          # bun, and nothing when the project names no package manager
          build_tool="${BUILD_TOOL_INPUT:-${DETECTED_PACKAGE_MANAGER:-npm}}"
          case "${build_tool}" in
            npm|yarn|yarn-berry|pnpm|bun) ;;
            *)
              # Building an unrecognised project with npm would ignore
              # its own lockfile, so refuse rather than fall back
              if [ -n "${BUILD_TOOL_INPUT}" ]; then
                origin='build_tool input'
              else
                origin='detected package manager'
              fi
              echo "::error::Unsupported ${origin}:" \
                "'$(printf '%s' "${build_tool}" | tr -d '\r\n')'" \
                "(must be npm, yarn, yarn-berry, pnpm or bun)"
              exit 1
              ;;
          esac
          # Only the resolved tool's own lockfile in path_prefix
          # counts, as node-build-action and node-audit-action each
          # read that one file. Another tool's lockfile does not.
          case "${build_tool}" in
            pnpm) tool_lockfiles=(pnpm-lock.yaml) ;;
            yarn|yarn-berry) tool_lockfiles=(yarn.lock) ;;
            bun) tool_lockfiles=(bun.lock bun.lockb) ;;
            *) tool_lockfiles=(package-lock.json npm-shrinkwrap.json) ;;
          esac
          has_tool_lockfile='false'
          for lockfile in "${tool_lockfiles[@]}"; do
            if [ -f "${PATH_PREFIX:-.}/${lockfile}" ]; then
              has_tool_lockfile='true'
              break
            fi
          done
          # Audit natively only beside that lockfile. Any other
          # project keeps npm, whose audit synthesizes a lockfile when
          # it lacks one. The action takes 'yarn' for Yarn classic and
          # Berry alike.
          audit_package_manager='npm'
          if [ "${has_tool_lockfile}" = 'true' ]; then
            audit_package_manager="${build_tool/#yarn-berry/yarn}"
          fi
          # A required lockfile installs frozen, so the build ships
          # the tree the audit, SBOM and scan read. Otherwise 'auto'
          # freezes when the lockfile exists and resolves when not.
          case "${LOCKFILE_REQUIRED:-false}" in
            true)
              if [ "${has_tool_lockfile}" != 'true' ]; then
                expected="${tool_lockfiles[*]}"
                echo "::error::lockfile_required is true, but" \
                  "'$(printf '%s' "${PATH_PREFIX:-.}" | tr -d '\r\n')'" \
                  "holds no ${build_tool} lockfile" \
                  "(${expected// / or }). Commit the lockfile, or set" \
                  "lockfile_required: false to permit a resolving install"
                exit 1
              fi
              install_mode='frozen'
              ;;
            false) install_mode='auto' ;;
            *)
              echo "::error::Invalid lockfile_required input:" \
                "'$(printf '%s' "${LOCKFILE_REQUIRED}" | tr -d '\r\n')'"
              exit 1
              ;;
          esac
          # Jobs that run the project's own toolchain can need a
          # different Node.js from the pack/publish jobs, which only
          # need a modern npm and never rebuild. A legacy dependency
          # tree can cap the first well below what the second
          # requires, leaving no single version that satisfies both.
          # Empty follows node_version, so this costs nothing unless
          # a caller needs the split.
          build_node_version="${BUILD_NODE_VERSION_INPUT}"
          if [ -n "${build_node_version}" ] &&
            [[ ! "${build_node_version}" =~ ^[A-Za-z0-9./*_-]+$ ]]; then
            echo "::error::Invalid build_node_version input:" \
              "$(printf '%s' "${build_node_version}" \
                | tr -d '\r\n')"
            exit 1
          fi
          if [ -z "${build_node_version}" ]; then
            build_node_version="${node_version}"
          fi
          test_node_version="${TEST_NODE_VERSION_INPUT}"
          if [ -n "${test_node_version}" ] &&
            [[ ! "${test_node_version}" =~ ^[A-Za-z0-9./*_-]+$ ]]; then
            echo "::error::Invalid test_node_version input:" \
              "$(printf '%s' "${test_node_version}" \
                | tr -d '\r\n')"
            exit 1
          fi
          if [ -z "${test_node_version}" ]; then
            test_node_version="${node_version}"
          fi
          # test_node_versions fans the tests job out, one leg per
          # version. Each entry carries the node_version allowlist: it
          # reaches setup-node, a job name and an artefact name. Both
          # inputs set leaves the precedence unclear, so it is refused.
          versions_input="${TEST_NODE_VERSIONS_INPUT}"
          if [[ "${versions_input}" =~ ^[[:space:]]*$ ]]; then
            versions_input=''
          elif [ -n "${TEST_NODE_VERSION_INPUT}" ]; then
            echo "::error::Set test_node_version or" \
              "test_node_versions, not both"
            exit 1
          fi
          versions=()
          if [[ "${versions_input}" =~ ^[[:space:]]*\[ ]]; then
            # A JSON array of strings or whole numbers, read back
            # NUL-delimited so an entry holding a newline reaches the
            # allowlist whole instead of splitting into two. That makes
            # NUL the one character an entry cannot carry: "22\u000024"
            # would split into two valid legs, so it is refused here
            if ! jq -es 'length == 1 and (.[0] | type == "array"
                and all(.[]; (type == "string"
                    and (explode | all(. != 0)))
                  or (type == "number" and . == floor)))' \
                <<< "${versions_input}" > /dev/null 2>&1; then
              echo "::error::test_node_versions is not a JSON array" \
                "of version strings"
              exit 1
            fi
            mapfile -d '' versions < <(jq -j \
              '.[] | tostring, "\u0000"' <<< "${versions_input}")
          elif [ -n "${versions_input}" ] &&
            [[ "${versions_input}" =~ (^|,)[[:space:]]*(,|$) ]]; then
            # An empty field between commas is a typo, as "" is in JSON
            echo "::error::test_node_versions has an empty entry"
            exit 1
          elif [ -n "${versions_input}" ]; then
            # read -a splits without globbing, so lts/* stays literal
            read -r -a versions <<< "${versions_input//[,$'\r\n\t']/ }"
          fi
          # Every value passed the allowlist, which admits no JSON
          # metacharacter, so plain interpolation yields valid JSON
          # $3 suffixes every artefact the leg uploads: test results
          # here, and the JUnit and coverage reports via matrix.suffix
          matrix_leg() {
            printf '{"node_version":"%s","name":"%s",' "$1" "$2"
            printf '"artifact":"node-test-results%s","suffix":"%s"}' \
              "$3" "$3"
          }
          test_matrix=''
          declare -A slug_owner=()
          for version in "${versions[@]}"; do
            if [[ ! "${version}" =~ ^[A-Za-z0-9./*_-]+$ ]]; then
              echo "::error::Invalid test_node_versions entry:" \
                "'$(printf '%s' "${version}" | tr -d '\r\n')'"
              exit 1
            fi
            # Artefact names reject / and *, so lts/* uploads as lts__
            slug="${version//[^A-Za-z0-9._-]/_}"
            owner="${slug_owner[${slug}]:-}"
            if [ "${owner}" = "${version}" ]; then
              echo "::notice::Ignoring duplicate test_node_versions" \
                "entry ${version}"
              continue
            elif [ -n "${owner}" ]; then
              echo "::error::test_node_versions entries ${owner} and" \
                "${version} would share an artefact name"
              exit 1
            fi
            slug_owner[${slug}]="${version}"
            # Suffixed per leg: two uploads of one name in a run fail
            test_matrix+="${test_matrix:+,}$(matrix_leg "${version}" \
              "Tests (Node ${version})" "-node-${slug}")"
          done
          if [ -z "${versions_input}" ]; then
            # One leg keeps the job and artefact names callers already
            # depend on, such as required checks and downloads by name
            test_matrix="$(matrix_leg "${test_node_version}" 'Tests' '')"
          elif [ "${#slug_owner[@]}" -eq 0 ]; then
            echo "::error::test_node_versions lists no versions"
            exit 1
          elif [ "${#slug_owner[@]}" -gt 10 ]; then
            echo "::error::test_node_versions lists" \
              "${#slug_owner[@]} versions; the limit is 10"
            exit 1
          fi
          test_matrix="[${test_matrix}]"
          echo "Resolved Node.js version: ${node_version}"
          echo "Resolved build tool: ${build_tool}"
          echo "Audit package manager: ${audit_package_manager}"
          echo "Install mode: ${install_mode}"
          echo "Build toolchain Node.js version: ${build_node_version}"
          echo "Test Node.js version: ${test_node_version}"
          echo "Test matrix: ${test_matrix}"
          {
            echo "node_version=${node_version}"
            echo "build_tool=${build_tool}"
            echo "audit_package_manager=${audit_package_manager}"
            echo "install_mode=${install_mode}"
            echo "build_node_version=${build_node_version}"
            echo "test_node_version=${test_node_version}"
            echo "test_matrix=${test_matrix}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: 'Node.js Build'
    needs: node-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    steps:
      # The build job can opt into audit egress independently of the
      # other jobs via build_permit_egress_traffic, for dependency
      # fetches from CDNs impractical to enumerate in the allow-list.
      # Left unset it follows harden_runner_egress like every other job.
      #
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever a
      # step-level 'if:' says. Both would engage the agent, the first
      # would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.build_permit_egress_traffic || inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Runs the project's build script(s) via node-build-action, which
      # installs dependencies with the resolved build tool first
      - name: 'Build project'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/node-build-action@fad23d431fa5f26395b577c120a7ffff62d3e8a2  # v0.4.0
        with:
          node_version: ${{ needs.node-metadata.outputs.build_node_version }}
          build_tool: ${{ needs.node-metadata.outputs.build_tool }}
          path_prefix: ${{ inputs.path_prefix }}
          scripts: ${{ inputs.build_scripts }}
          # node-metadata resolves it from lockfile_required
          install_mode: ${{ needs.node-metadata.outputs.install_mode }}

      - name: 'Upload build artefact'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: node-build-output${{ inputs.artifact_suffix }}
          path: ${{ inputs.path_prefix }}/dist
          retention-days: 7
          # Not every package emits dist/; the upload is informational
          if-no-files-found: warn

  tests:
    # One leg per resolved test version. Without test_node_versions
    # the single leg keeps the 'Tests' name. A skipped job never
    # expands its matrix, hence the fallback.
    name: ${{ matrix.name || 'Tests' }}
    runs-on: ubuntu-latest
    needs:
      - 'node-metadata'
      - 'build'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.tests_enabled }}
    # Every leg runs to completion; any failing leg fails the job
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.node-metadata.outputs.test_matrix) }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.test_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Run tests'
        id: run-tests
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/node-build-action@fad23d431fa5f26395b577c120a7ffff62d3e8a2  # v0.4.0
        # The NO_BLOCK/soft-fail pattern: setting the
        # test_permit_fail input, or the NO_BLOCK_AUDIT_FAIL
        # repository variable (an org/repo-wide override that
        # soft-fails these checks even when the caller passes
        # false), disables failure propagation.
        # yamllint disable-line rule:line-length
        continue-on-error: ${{ inputs.test_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        # Each leg installs dependencies afresh under its own Node.js
        with:
          node_version: ${{ matrix.node_version }}
          build_tool: ${{ needs.node-metadata.outputs.build_tool }}
          path_prefix: ${{ inputs.path_prefix }}
          scripts: ${{ inputs.test_script }}
          # Missing scripts warn and skip (npm --if-present parity)
          exit_on_fail: 'false'
          # node-metadata resolves it from lockfile_required
          install_mode: ${{ needs.node-metadata.outputs.install_mode }}

      - name: 'Report permitted test failure'
        # Explicitly gated on the permit condition: without it a real
        # (blocking) failure would already fail the job, but keep the
        # intent unambiguous
        # yamllint disable-line rule:line-length
        if: ${{ steps.run-tests.outcome == 'failure' && (inputs.test_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true') }}
        shell: bash
        run: |
          # Report permitted test failure
          echo "::warning::Tests failed, but failures are" \
            "permitted so the job will not fail."

      - name: 'Upload test artefacts'
        if: ${{ !cancelled() && inputs.test_artifact_path != '' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.artifact }}${{ inputs.artifact_suffix }}
          path: ${{ inputs.path_prefix }}/${{ inputs.test_artifact_path }}
          retention-days: 7
          if-no-files-found: warn

      # Test reporting. The Run tests step alone decides pass or fail
      # (honouring test_permit_fail), so these steps never fail the
      # job on results; they run after a failed test step too, when
      # the reports matter most. A missing report warns: tests that
      # crash before writing one already fail the Run tests step.
      # The uploads take the leg's matrix.suffix, empty on the single
      # default leg, and the call's artifact_suffix, as uploads in one
      # run need distinct names.
      - name: 'Summarise JUnit test results'
        id: junit
        if: ${{ !cancelled() && inputs.junit_report_path != '' }}
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/junit-test-report-action@85e6bbd4dfcc434acf458fa1b49d55f367f802cc  # v0.0.3
        with:
          # yamllint disable-line rule:line-length
          report-paths: ${{ inputs.path_prefix }}/${{ inputs.junit_report_path }}
          fail-on-failure: 'false'
          # yamllint disable-line rule:line-length
          artifact-name: 'node-junit${{ matrix.suffix }}${{ inputs.artifact_suffix }}'

      - name: 'Report missing JUnit reports'
        if: ${{ !cancelled() && steps.junit.outputs.result == 'none' }}
        shell: bash
        env:
          JUNIT_REPORT_PATH: ${{ inputs.junit_report_path }}
        run: |
          # Report missing JUnit reports
          echo "::warning::No JUnit reports match junit_report_path" \
            "${JUNIT_REPORT_PATH}"

      - name: 'Summarise coverage'
        id: coverage
        if: ${{ !cancelled() && inputs.coverage_path != '' }}
        shell: bash
        working-directory: ${{ inputs.path_prefix }}
        env:
          COVERAGE_PATH: ${{ inputs.coverage_path }}
        run: |
          # Summarise coverage (reporting only: no thresholds)
          target="${COVERAGE_PATH%/}"
          summary=''
          lcov=''
          if [ -d "${target}" ]; then
            if [ -f "${target}/coverage-summary.json" ]; then
              summary="${target}/coverage-summary.json"
            fi
            if [ -f "${target}/lcov.info" ]; then
              lcov="${target}/lcov.info"
            fi
          elif [ -f "${target}" ]; then
            case "${target}" in
              *.json) summary="${target}" ;;
              *) lcov="${target}" ;;
            esac
          else
            echo "::warning::No coverage report at coverage_path" \
              "${COVERAGE_PATH}"
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The path exists, so it is uploaded whatever its format
          echo 'found=true' >> "$GITHUB_OUTPUT"

          # Each parser prints one 'metric<TAB>covered<TAB>total' row
          # per metric it knows, and fails on input it cannot read
          parse_summary() {
            # istanbul json-summary: totals sit under .total, and a
            # metric short of numeric counts makes the file unreadable.
            # -e fails an empty or blank file too, which holds no JSON
            # value and so would otherwise succeed with no rows
            jq -er '
              .total as $t
              | ("lines", "branches", "functions", "statements") as $m
              | $t[$m] as $v
              | if ($v | type) == "object"
                  and ($v.covered | type) == "number"
                  and ($v.total | type) == "number"
                then [$m, $v.covered, $v.total] | @tsv
                else error("no numeric total.\($m)") end' "$1"
          }
          parse_lcov() {
            # Sum each record's totals; lcov has no statement count
            awk -F: '
              { sub(/\r$/, "") }
              $1 == "SF" { records++ }
              $1 == "LF" { lf += $2 } $1 == "LH" { lh += $2 }
              $1 == "BRF" { brf += $2 } $1 == "BRH" { brh += $2 }
              $1 == "FNF" { fnf += $2 } $1 == "FNH" { fnh += $2 }
              END {
                if (!records) exit 1
                printf "lines\t%d\t%d\n", lh, lf
                printf "branches\t%d\t%d\n", brh, brf
                printf "functions\t%d\t%d\n", fnh, fnf
              }' "$1"
          }
          if [ -n "${summary}" ] \
            && rows="$(parse_summary "${summary}")"; then
            report="${summary}"
          elif [ -n "${lcov}" ] && rows="$(parse_lcov "${lcov}")"; then
            report="${lcov}"
          else
            echo "::warning::No readable lcov.info or" \
              "coverage-summary.json at coverage_path ${COVERAGE_PATH}"
            exit 0
          fi

          table="$(awk -F'\t' '{
            pct = ($3 > 0) ? sprintf("%.2f%%", 100 * $2 / $3) : "n/a"
            printf "| %s%s | %d | %d | %s |\n",
              toupper(substr($1, 1, 1)), substr($1, 2), $2, $3, pct
          }' <<< "${rows}")"
          {
            echo '## 📊 Coverage'
            echo ''
            echo "From \`${report}\`"
            echo ''
            echo '| Metric | Covered | Total | Coverage |'
            echo '| ------ | ------- | ----- | -------- |'
            echo "${table}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 'Upload coverage artefact'
        if: ${{ !cancelled() && steps.coverage.outputs.found == 'true' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: 'node-coverage${{ matrix.suffix }}${{ inputs.artifact_suffix }}'
          path: ${{ inputs.path_prefix }}/${{ inputs.coverage_path }}
          retention-days: 7
          if-no-files-found: warn

  # Runs the project's own pre-commit hooks that pre-commit.ci cannot:
  # by default those listed under ci.skip, typically 'language: system'
  # hooks (eslint, prettier, tsc) needing the project's node_modules,
  # which standalone-linting-action installs frozen from the lockfile.
  # It reads the source alone, so it needs no build output and runs
  # beside the build rather than after it.
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    needs:
      - 'node-metadata'
    if: ${{ inputs.lint_enabled }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.test_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The action fails without a configuration, and many projects
      # have none, so their lint passes with a notice instead
      - name: 'Find lint configuration'
        id: lint-config
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # Find lint configuration
          config="${PATH_PREFIX}/.pre-commit-config.yaml"
          if [ -f "${config}" ]; then
            echo "Linting with ${config}"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ${config}; skipping lint"
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      # no_checkout keeps the checkout above, so a Gerrit change is
      # linted at the change under test
      - name: 'Lint project'
        id: lint
        if: steps.lint-config.outputs.present == 'true'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/standalone-linting-action@c63239ab493b3ddb506524143c34a723880d3e3c  # v0.8.0
        # The NO_BLOCK/soft-fail pattern, as for the tests job
        # yamllint disable-line rule:line-length
        continue-on-error: ${{ inputs.lint_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        with:
          path_prefix: ${{ inputs.path_prefix }}
          no_checkout: 'true'
          # Empty runs the configuration's ci.skip hooks
          hooks: ${{ inputs.lint_hooks }}
          # The project's own toolchain, as the build and tests use
          node_version: ${{ needs.node-metadata.outputs.build_node_version }}
          # Reaches only the hook environment, for hooks calling the
          # GitHub API such as gha-workflow-linter
          github_token: ${{ github.token }}

      - name: 'Report permitted lint failure'
        # yamllint disable-line rule:line-length
        if: ${{ steps.lint.outcome == 'failure' && (inputs.lint_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true') }}
        shell: bash
        run: |
          # Report permitted lint failure
          echo "::warning::Lint failed, but failures are" \
            "permitted so the job will not fail."

  audit:
    name: 'Audit'
    runs-on: ubuntu-latest
    needs:
      - 'node-metadata'
      - 'build'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.audit_enabled }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.audit_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # node-audit-action synthesizes a lockfile when the project
      # lacks one, so legacy projects still get audit coverage
      - name: 'Audit dependencies'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/node-audit-action@b531c8229b3a543610b62a7a98b752d30dda5dff  # v0.1.0
        with:
          path_prefix: ${{ inputs.path_prefix }}
          node_version: ${{ needs.node-metadata.outputs.node_version }}
          audit_level: ${{ inputs.audit_level }}
          production_only: ${{ inputs.production_only }}
          # The project's own package manager, so the audit reads the
          # lockfile it installs from. The action detects Yarn Berry
          # from the lockfile itself and takes 'yarn' for both. A
          # project without that tool's own lockfile keeps npm, whose
          # audit synthesizes one; the other tools' audits need
          # theirs. node-metadata resolves the choice.
          # yamllint disable-line rule:line-length
          package_manager: ${{ needs.node-metadata.outputs.audit_package_manager }}
          # The NO_BLOCK/soft-fail pattern: setting the
          # audit_permit_fail input, or the NO_BLOCK_AUDIT_FAIL
          # repository variable (an org/repo-wide override that
          # soft-fails these checks even when the caller passes
          # false), disables failure propagation.
          # yamllint disable-line rule:line-length
          permit_fail: ${{ inputs.audit_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}

  sbom:
    name: 'Generate SBOM'
    runs-on: ubuntu-latest
    needs: 'build'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.sbom_enabled }}
    timeout-minutes: ${{ inputs.audit_timeout_minutes }}
    permissions:
      contents: read
    outputs:
      # 'true' or 'false' when the change was resolved, else empty
      dependency_changed: ${{ steps.dependency-change.outputs.changed }}
      sbom_artifact_id: ${{ steps.upload-sbom.outputs.artifact-id }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          # The parent lets dependency-change detection compare HEAD
          # with its base; the Gerrit checkout fetches it by default
          fetch-depth: 2
          persist-credentials: false

      # Emits sbom-cyclonedx.json at the workspace root (the Grype
      # job contract)
      - name: 'Generate SBOM'
        id: sbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/sbom-action@cd6b02f4d099fc19153b505c9faa7bd01ccfa0e5  # v0.4.0
        with:
          path_prefix: ${{ inputs.path_prefix }}
          filename_prefix: 'sbom-cyclonedx'
          output_directory: '.'
          include_dev: 'false'

      # Sets the 'changed' output for the Grype job's
      # dependencies-changed gate. Every path that cannot show what the
      # change touched leaves it unset, which the Grype job passes on
      # as unresolved, keeping the gate on.
      - name: 'Detect dependency changes'
        id: dependency-change
        # yamllint disable-line rule:line-length
        if: inputs.grype_enabled && inputs.grype_gate_when == 'dependencies-changed'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          GERRIT_REFSPEC: ${{ inputs.gerrit_refspec }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # Detect dependency changes
          set -euo pipefail

          unresolved() {
            echo "Dependency change unresolved: $1; Grype gates as usual"
            echo "result=unresolved ($1)" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          if ! head=$(git rev-parse -q --verify 'HEAD^{commit}'); then
            unresolved 'no commit is checked out'
          fi
          if [ -n "${GERRIT_REFSPEC}" ]; then
            # The Gerrit checkout is the change itself
            base_ref='HEAD^1'
          elif [ "${head}" != "${GITHUB_SHA}" ]; then
            # An explicit ref or another repository is not the change
            # that triggered this run, so its history says nothing
            unresolved 'the checkout is not the triggering commit'
          else
            case "${GITHUB_EVENT_NAME}" in
              # HEAD is GitHub's merge commit, so its first parent is
              # the base branch and the diff spans the whole PR
              pull_request) base_ref='HEAD^1' ;;
              # HEAD^1 would see only the last commit of a multi-commit
              # push; 'before' covers them all when it was fetched
              push)
                before="${EVENT_BEFORE}"
                if [[ ! "${before}" =~ ^[0-9a-f]+$ ]] \
                  || [[ "${before}" =~ ^0+$ ]]; then
                  unresolved 'the push names no previous commit'
                fi
                base_ref="${before}"
                ;;
              *) unresolved "${GITHUB_EVENT_NAME} runs have no base" ;;
            esac
          fi
          # A shallow clone grafts the oldest fetched commit as a root,
          # so a parent that was not fetched does not resolve
          if ! base=$(git rev-parse -q --verify "${base_ref}^{commit}"); then
            unresolved "${base_ref} is not in the checkout"
          fi

          list=$(mktemp)
          if ! git diff --name-only --no-renames -z "${base}" "${head}" \
            > "${list}"; then
            unresolved 'git diff failed'
          fi

          # Compare in git's terms: canonical, relative to the checkout
          # top, with '.' segments and symlinks resolved
          if ! top=$(cd -- "$(git rev-parse --show-toplevel)" && pwd -P) \
            || ! project=$(cd -- "${PATH_PREFIX}" && pwd -P); then
            unresolved "path_prefix ${PATH_PREFIX} is not a directory"
          fi
          if [ "${project}" = "${top}" ]; then
            prefix='.'
          elif [[ "${project}" == "${top}/"* ]]; then
            prefix="${project#"${top}/"}"
          else
            unresolved "path_prefix ${PATH_PREFIX} leaves the checkout"
          fi
          # A change can retarget a symlink on the way to the project,
          # swapping its whole dependency tree without touching a file
          # matched below, so a prefix through one cannot be judged
          lexical=''
          IFS='/' read -r -a parts <<< "${PATH_PREFIX}"
          for part in "${parts[@]}"; do
            case "${part}" in
              ''|.) ;;
              *) lexical="${lexical:+${lexical}/}${part}" ;;
            esac
          done
          if [ "${prefix}" != "${lexical:-.}" ]; then
            unresolved "path_prefix ${PATH_PREFIX} passes through a symlink"
          fi
          changed=false
          while IFS= read -r -d '' path; do
            case "${path##*/}" in
              package.json|package-lock.json|npm-shrinkwrap.json) ;;
              yarn.lock|.yarnrc.yml|pnpm-lock.yaml) ;;
              pnpm-workspace.yaml|bun.lock|bun.lockb) ;;
              *) continue ;;
            esac
            dir=''
            if [[ "${path}" == */* ]]; then
              dir="${path%/*}"
            fi
            # Inside the project at any depth, or directly in a
            # directory above it, where a workspace root keeps the
            # lockfile and overrides that resolve the project
            if [ "${prefix}" = '.' ] || [ -z "${dir}" ] \
              || [[ "${path}" == "${prefix}/"* ]] \
              || [[ "${prefix}/" == "${dir}/"* ]]; then
              # %q keeps a path with a newline on one line, so it
              # cannot forge a workflow command
              printf 'Dependency file changed: %q\n' "${path}"
              changed=true
            fi
          done < "${list}"

          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          echo "Dependency change since ${base:0:12}: ${changed}"
          echo "result=${changed} (since ${base:0:12})" >> "${GITHUB_OUTPUT}"

      - name: 'Upload SBOM artifacts'
        id: upload-sbom
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-files${{ inputs.artifact_suffix }}
          # Glob matches whichever SBOM formats the generator produced
          path: sbom-cyclonedx.*
          retention-days: 45
          # Fail fast: the downstream Grype job requires this artifact,
          # so a missing/misnamed SBOM must surface here, not later
          if-no-files-found: error

      - name: 'SBOM summary'
        shell: bash
        env:
          COMPONENT_COUNT: ${{ steps.sbom.outputs.component_count }}
          DEPENDENCY_CHANGE: ${{ steps.dependency-change.outputs.result }}
        run: |
          # SBOM summary
          {
            echo "## SBOM Summary"
            echo "CycloneDX SBOM with ${COMPONENT_COUNT} components"
            if [ -n "${DEPENDENCY_CHANGE}" ]; then
              echo ""
              echo "Dependency change: ${DEPENDENCY_CHANGE}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    needs: 'sbom'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.sbom.result == 'success' && inputs.grype_enabled }}
    timeout-minutes: ${{ inputs.audit_timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # By this call's artefact ID, never by name: another call in the
      # run can share the name, and a name resolves to the newest
      # upload, which may be that call's SBOM. The step name carries
      # the ID into the job log, where the self-test reads it.
      # yamllint disable-line rule:line-length
      - name: 'Download SBOM artefact ${{ needs.sbom.outputs.sbom_artifact_id }}'
        id: download-sbom
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ needs.sbom.outputs.sbom_artifact_id }}

      # download-artifact looks IDs up among the newest artefact of
      # each name only, so it cannot find an older upload whose name
      # another call reused: the fix belongs in the caller
      - name: 'Explain SBOM download failure'
        if: failure() && steps.download-sbom.outcome == 'failure'
        shell: bash
        run: |
          # Explain SBOM download failure
          echo "::error::If no artefact ID was found, another call in" \
            "this run uploaded a newer artefact under this call's SBOM" \
            "name. Give each call its own artifact_suffix input."

      # The change signal comes from this call's own sbom job output
      # rather than a file in the artefact. Only a resolved 'true' or
      # 'false' writes the manifest; without one, the gate stays on.
      - name: 'Write dependency-change manifest'
        if: inputs.grype_gate_when == 'dependencies-changed'
        shell: bash
        env:
          CHANGED: ${{ needs.sbom.outputs.dependency_changed }}
        run: |
          # Write dependency-change manifest
          set -euo pipefail
          manifest='dependency-change.json'
          rm -f -- "${manifest}"
          case "${CHANGED}" in
            true|false)
              printf '{"changed": %s}\n' "${CHANGED}" > "${manifest}"
              echo "Dependency change: ${CHANGED}"
              ;;
            *) echo 'Dependency change unresolved; Grype gates as usual' ;;
          esac

      # Setting the grype_permit_fail input, or the NO_BLOCK_AUDIT_FAIL
      # repository variable (an org/repo-wide override that soft-fails
      # this check even when the caller passes false), disables failure
      # propagation so pull requests
      # can proceed when blocked by newly discovered CVEs in transitive
      # dependencies. grype_gate_when narrows when findings block in
      # the first place; permit-fail still passes an armed gate.
      - name: 'Grype audit SBOM'
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@7b6b12b60de8ff051f2f8021439c1ef0b82b98c1  # v0.4.0
        with:
          sbom: 'sbom-cyclonedx.json'
          fail-on: ${{ inputs.grype_fail_on }}
          artifact-name: 'grype-scan-results${{ inputs.artifact_suffix }}'
          gate-when: ${{ inputs.grype_gate_when }}
          # Absent unless the sbom job resolved the change; an absent
          # manifest keeps the gate on
          dependency-change-manifest: 'dependency-change.json'
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The action's summary gives the gate's reason only when it
      # downgraded findings to warnings; record the decision on every
      # dependency-aware run, including those that gate or find nothing
      - name: 'Grype gate summary'
        # yamllint disable-line rule:line-length
        if: ${{ !cancelled() && inputs.grype_gate_when == 'dependencies-changed' && steps.grype-audit.outcome != 'skipped' }}
        shell: bash
        env:
          GATE_ACTIVE: ${{ steps.grype-audit.outputs.gate-active }}
          GATE_REASON: ${{ steps.grype-audit.outputs.gate-reason }}
          ADVISORY: ${{ steps.grype-audit.outputs.advisory-matches }}
        run: |
          # Grype gate summary
          {
            echo "### Grype gate"
            echo ""
            echo "| Gate active | Reason | Advisory matches |"
            echo "| ----------- | ------ | ---------------- |"
            echo "| ${GATE_ACTIVE:-unknown} | ${GATE_REASON:-unknown}" \
              "| ${ADVISORY:-unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"
