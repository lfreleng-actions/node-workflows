---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Node.js build/test pipeline.
#
# Reproduces the canonical Linux Foundation pipeline shape. The
# repository-metadata job runs in parallel as an informational step;
# node-metadata resolves the effective Node.js version and build tool
# (explicit inputs win, then package.json detection, then defaults).
# After build the jobs in { } run in parallel; none gates another, so a
# PR surfaces every failure (-> denotes sequence):
#   node-metadata -> build -> { tests | audit | sbom -> grype }
#
# Call this from a thin caller workflow; see examples/build-test/ for
# both a plain GitHub-native caller and a Gerrit-wrapped caller.
name: '[R] Node.js Build/Test'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: >-
          Branch/tag/SHA to check out. Empty uses the triggering
          event's ref for same-repository checkouts, or the default
          branch when checking out a different repository.
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Node.js toolchain ---
      node_version:
        description: >-
          Node.js version to use. Empty (the default) auto-detects a
          plain engines.node version from package.json and otherwise
          falls back to the current default (22).
        required: false
        type: string
        default: ''
      build_node_version:
        description: >-
          Node.js version for jobs that run the project's own
          toolchain. Empty (the default) follows node_version. Set
          this when a legacy dependency tree caps the build below the
          version the pack/publish jobs need.
        required: false
        type: string
        default: ''
      test_node_version:
        description: >-
          Node.js version for the test job. Empty (the default)
          follows node_version. Projects needing build_node_version
          often test on a newer toolchain than they build on.
        required: false
        type: string
        default: ''
      build_tool:
        description: >-
          Build tool: 'npm' or 'yarn'. Empty (the default) auto-detects
          the package manager from the project lockfile/metadata and
          otherwise falls back to npm.
        required: false
        type: string
        default: ''

      # --- Build ---
      build_scripts:
        description: 'package.json script(s) the build job runs'
        required: false
        type: string
        default: 'build'

      # --- Tests ---
      tests_enabled:
        description: 'Run the tests job (set false to skip tests)'
        required: false
        type: boolean
        default: true
      test_script:
        description: >-
          package.json script(s) the tests job runs; accepts a comma,
          space or newline separated list
        required: false
        type: string
        default: 'test'
      test_permit_fail:
        description: 'Permit test failures without failing the workflow'
        required: false
        type: boolean
        default: false
      test_artifact_path:
        description: >-
          Path (relative to path_prefix) of test output/reports to
          upload as a workflow artefact; empty disables the upload
        required: false
        type: string
        default: ''
      junit_report_path:
        description: >-
          Glob (relative to path_prefix) of JUnit XML reports to render
          in the tests job summary and upload as node-junit; empty
          disables
        required: false
        type: string
        default: ''
      coverage_path:
        description: >-
          Path (relative to path_prefix) of an lcov.info or istanbul
          coverage-summary.json file, or a directory holding either, to
          summarise in the tests job summary and upload as
          node-coverage; empty disables
        required: false
        type: string
        default: ''

      # --- Audit ---
      audit_enabled:
        description: 'Run the dependency audit job (set false to skip)'
        required: false
        type: boolean
        default: true
      audit_level:
        description: >-
          npm audit severity threshold that fails the audit: 'info',
          'low', 'moderate', 'high' or 'critical'
          (matches the node-audit-action default)
        required: false
        type: string
        default: 'high'
      production_only:
        description: 'Audit production dependencies only'
        required: false
        type: boolean
        default: false
      audit_permit_fail:
        description: 'Permit dependency audit failures (the NO_BLOCK pattern)'
        required: false
        type: boolean
        default: false

      # --- SBOM/Grype scan ---
      sbom_enabled:
        description: >-
          Generate an SBOM (set false to skip). The Grype scan
          reads the SBOM, so skipping generation leaves it nothing to
          scan. To keep the SBOM but drop the scan, use grype_enabled.
        required: false
        type: boolean
        default: true
      grype_enabled:
        description: >-
          Run the Grype vulnerability scan over the generated SBOM (set
          false to skip). Decoupling is one-way: disabling the scan
          keeps the SBOM, but disabling the SBOM also stops the scan,
          which has nothing to read.
        required: false
        type: boolean
        default: true
      grype_fail_on:
        description: 'Minimum severity that fails the Grype scan'
        required: false
        type: string
        default: 'medium'
      grype_permit_fail:
        description: >-
          Permit Grype findings without failing the job. When false, falls
          back to the NO_BLOCK_AUDIT_FAIL repository variable at runtime.
        required: false
        type: boolean
        default: false

      # --- Job timeouts ---
      build_timeout_minutes:
        description: 'Timeout (minutes) for the build job'
        required: false
        type: number
        default: 15
      test_timeout_minutes:
        description: 'Timeout (minutes) for the tests job'
        required: false
        type: number
        default: 10
      audit_timeout_minutes:
        description: 'Timeout (minutes) for the audit, SBOM and Grype jobs'
        required: false
        type: number
        default: 10

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      build_permit_egress_traffic:
        description: >
          Run harden-runner in audit mode for the build job only,
          permitting unrestricted egress. Use when the build fetches
          dependencies from CDNs that are impractical to enumerate in the
          allow-list. Other jobs stay governed by harden_runner_egress;
          left unset, the build job follows it too.
        required: false
        type: boolean
        default: false
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@e0e35011ee145321a51d3226f044ec88dfe645b1'  # v0.16.4

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Workflow Inputs'
    # Fails fast with a clear message on invalid workflow inputs: the
    # test artefact path, job timeouts, and the Gerrit parameters (when
    # gerrit_refspec is set without the project/branch the Gerrit
    # checkout path also requires). The build-chain root job depends on
    # this, so invalid inputs stop the pipeline early and cleanly. This
    # job always runs (only some validation steps are conditional), so
    # gating dependents on it does not trip GitHub's "skipped need
    # skips dependents" behaviour.
    # The job carries no harden-runner step by design: it performs pure
    # input-string validation with no checkout, artifacts or network
    # access, and loading the egress allow-list would itself add an
    # outbound call.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Validate path_prefix input'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # Require a relative, non-traversing path: later jobs cd
          # into it and derive packaging/publish paths from it, so
          # absolute paths or .. segments could escape the checkout
          # A single trailing slash is tolerated ('./' == '.',
          # 'subdir/' == 'subdir')
          PATH_PREFIX="${PATH_PREFIX%/}"
          if [ "${PATH_PREFIX}" = '.' ]; then
            exit 0
          fi
          if [[ ! "${PATH_PREFIX}" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] \
            || [[ "${PATH_PREFIX}" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid path_prefix input: ${PATH_PREFIX}"
            exit 1
          fi

      - name: 'Validate test_artifact_path input'
        if: inputs.test_artifact_path != ''
        shell: bash
        env:
          TEST_ARTIFACT_PATH: ${{ inputs.test_artifact_path }}
        run: |
          # Require a relative, non-traversing path (the * wildcard
          # permitted): the tests job joins it onto path_prefix for
          # the artefact upload, so absolute paths or .. segments
          # could pull in files from outside the checkout
          valid='^[A-Za-z0-9._*-]+(/[A-Za-z0-9._*-]+)*/?$'
          if [[ ! "${TEST_ARTIFACT_PATH}" =~ ${valid} ]] \
            || [[ "${TEST_ARTIFACT_PATH}" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid test_artifact_path input:" \
              "${TEST_ARTIFACT_PATH}"
            exit 1
          fi

      - name: 'Validate test report path inputs'
        id: validate-report-paths
        if: inputs.junit_report_path != '' || inputs.coverage_path != ''
        shell: bash
        env:
          JUNIT_REPORT_PATH: ${{ inputs.junit_report_path }}
          COVERAGE_PATH: ${{ inputs.coverage_path }}
        run: |
          # The test_artifact_path rules: the tests job joins these
          # onto path_prefix, so absolute paths or .. segments could
          # read or upload files from outside the checkout. Only the
          # JUnit glob takes the * wildcard; coverage_path names one
          # file or directory
          errors=0
          check() {
            local name="$1" value="$2" chars="$3"
            local valid="^[${chars}]+(/[${chars}]+)*/?$"
            if [ -n "${value}" ] && { [[ ! "${value}" =~ ${valid} ]] \
              || [[ "${value}" =~ (^|/)\.\.(/|$) ]]; }; then
              # A newline in the value could forge a workflow command
              echo "::error::Invalid ${name} input:" \
                "$(printf '%s' "${value}" | tr -d '\r\n')"
              errors=1
            fi
          }
          check junit_report_path "${JUNIT_REPORT_PATH}" 'A-Za-z0-9._*-'
          check coverage_path "${COVERAGE_PATH}" 'A-Za-z0-9._-'
          exit "${errors}"

      - name: 'Validate job timeout inputs'
        shell: bash
        env:
          BUILD_TIMEOUT: ${{ inputs.build_timeout_minutes }}
          TEST_TIMEOUT: ${{ inputs.test_timeout_minutes }}
          AUDIT_TIMEOUT: ${{ inputs.audit_timeout_minutes }}
        run: |
          # Require whole-minute timeouts in the range 1-360 (the
          # GitHub-hosted runner job cap). Values GitHub itself
          # rejects (e.g. fractional numbers) can fail workflow
          # evaluation before this step runs; for values that do
          # reach it (zero, negative or out-of-range), this gives a
          # clear fail-fast error
          error=0
          for entry in \
            "build_timeout_minutes=${BUILD_TIMEOUT}" \
            "test_timeout_minutes=${TEST_TIMEOUT}" \
            "audit_timeout_minutes=${AUDIT_TIMEOUT}"; do
            name="${entry%%=*}"; value="${entry#*=}"
            if [[ ! "${value}" =~ ^[0-9]+$ ]] \
              || [ "${value}" -lt 1 ] || [ "${value}" -gt 360 ]; then
              echo "::error::Invalid ${name} input: ${value}"
              error=1
            fi
          done
          exit "${error}"

      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@847400e0d0b34cc88a572fa9575accd80401b796  # v0.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  node-metadata:
    name: 'Node.js Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.resolve.outputs.node_version }}
      build_tool: ${{ steps.resolve.outputs.build_tool }}
      # yamllint disable-line rule:line-length
      build_node_version: ${{ steps.resolve.outputs.build_node_version }}
      # yamllint disable-line rule:line-length
      test_node_version: ${{ steps.resolve.outputs.test_node_version }}
      # yamllint disable-line rule:line-length
      has_lock_file: ${{ steps.build-metadata.outputs.javascript_has_lock_file }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Gather Node.js build metadata'
        id: build-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/build-metadata-action@ef53139abdf48a63b097efc740202c140571b0d4  # v0.8.3
        with:
          path_prefix: ${{ inputs.path_prefix }}
          artifact_upload: 'false'

      - name: 'Resolve Node.js version and build tool'
        id: resolve
        shell: bash
        env:
          NODE_VERSION_INPUT: ${{ inputs.node_version }}
          BUILD_NODE_VERSION_INPUT: ${{ inputs.build_node_version }}
          TEST_NODE_VERSION_INPUT: ${{ inputs.test_node_version }}
          BUILD_TOOL_INPUT: ${{ inputs.build_tool }}
          # yamllint disable-line rule:line-length
          DETECTED_PACKAGE_MANAGER: ${{ steps.build-metadata.outputs.javascript_package_manager }}
          # yamllint disable-line rule:line-length
          DETECTED_REQUIRES_NODE: ${{ steps.build-metadata.outputs.javascript_requires_node }}
        run: |
          # Resolve the effective Node.js version and build tool:
          # explicit inputs win, then metadata detection, then defaults
          node_version="${NODE_VERSION_INPUT}"
          # Constrain caller input to the character set the downstream
          # setup/audit/publish actions accept, and keep the value safe
          # to write to $GITHUB_OUTPUT
          if [ -n "${node_version}" ] &&
            [[ ! "${node_version}" =~ ^[A-Za-z0-9./*_-]+$ ]]; then
            echo "::error::Invalid node_version input:" \
              "$(printf '%s' "${node_version}" | tr -d '\r\n')"
            exit 1
          fi
          if [ -z "${node_version}" ]; then
            # Use the engines.node constraint when it names a plain
            # version; downstream actions reject range syntax (>=18)
            if [[ "${DETECTED_REQUIRES_NODE}" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]
            then
              node_version="${DETECTED_REQUIRES_NODE}"
            elif [ -n "${DETECTED_REQUIRES_NODE}" ]; then
              echo "::notice::engines.node constraint" \
                "'${DETECTED_REQUIRES_NODE}' is not a plain version;" \
                "using the default Node.js version"
            fi
          fi
          if [ -z "${node_version}" ]; then
            node_version='22'
          fi
          build_tool="${BUILD_TOOL_INPUT}"
          case "${build_tool}" in
            npm|yarn) ;;
            '')
              case "${DETECTED_PACKAGE_MANAGER}" in
                npm|yarn)
                  build_tool="${DETECTED_PACKAGE_MANAGER}"
                  ;;
                '')
                  build_tool='npm'
                  ;;
                *)
                  echo "::notice::Detected package manager" \
                    "'${DETECTED_PACKAGE_MANAGER}' lacks" \
                    "node-build-action support; using npm"
                  build_tool='npm'
                  ;;
              esac
              ;;
            *)
              echo "::error::Invalid build_tool input: ${build_tool}" \
                "(must be 'npm' or 'yarn')"
              exit 1
              ;;
          esac
          # Jobs that run the project's own toolchain can need a
          # different Node.js from the pack/publish jobs, which only
          # need a modern npm and never rebuild. A legacy dependency
          # tree can cap the first well below what the second
          # requires, leaving no single version that satisfies both.
          # Empty follows node_version, so this costs nothing unless
          # a caller needs the split.
          build_node_version="${BUILD_NODE_VERSION_INPUT}"
          if [ -n "${build_node_version}" ] &&
            [[ ! "${build_node_version}" =~ ^[A-Za-z0-9./*_-]+$ ]]; then
            echo "::error::Invalid build_node_version input:" \
              "$(printf '%s' "${build_node_version}" \
                | tr -d '\r\n')"
            exit 1
          fi
          if [ -z "${build_node_version}" ]; then
            build_node_version="${node_version}"
          fi
          test_node_version="${TEST_NODE_VERSION_INPUT}"
          if [ -n "${test_node_version}" ] &&
            [[ ! "${test_node_version}" =~ ^[A-Za-z0-9./*_-]+$ ]]; then
            echo "::error::Invalid test_node_version input:" \
              "$(printf '%s' "${test_node_version}" \
                | tr -d '\r\n')"
            exit 1
          fi
          if [ -z "${test_node_version}" ]; then
            test_node_version="${node_version}"
          fi
          echo "Resolved Node.js version: ${node_version}"
          echo "Resolved build tool: ${build_tool}"
          echo "Build toolchain Node.js version: ${build_node_version}"
          echo "Test Node.js version: ${test_node_version}"
          {
            echo "node_version=${node_version}"
            echo "build_tool=${build_tool}"
            echo "build_node_version=${build_node_version}"
            echo "test_node_version=${test_node_version}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: 'Node.js Build'
    needs: node-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    steps:
      # The build job can opt into audit egress independently of the
      # other jobs via build_permit_egress_traffic, for dependency
      # fetches from CDNs impractical to enumerate in the allow-list.
      # Left unset it follows harden_runner_egress like every other job.
      #
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever a
      # step-level 'if:' says. Both would engage the agent, the first
      # would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.build_permit_egress_traffic || inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Runs the project's build script(s) via node-build-action, which
      # installs dependencies with the resolved build tool first
      - name: 'Build project'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/node-build-action@02ffec745cddf67291d0b28f64bd81990cae327f  # v0.2.4
        with:
          node_version: ${{ needs.node-metadata.outputs.build_node_version }}
          build_tool: ${{ needs.node-metadata.outputs.build_tool }}
          path_prefix: ${{ inputs.path_prefix }}
          scripts: ${{ inputs.build_scripts }}

      - name: 'Upload build artefact'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: node-build-output
          path: ${{ inputs.path_prefix }}/dist
          retention-days: 7
          # Not every package emits dist/; the upload is informational
          if-no-files-found: warn

  tests:
    name: 'Tests'
    runs-on: ubuntu-latest
    needs:
      - 'node-metadata'
      - 'build'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.tests_enabled }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.test_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Run tests'
        id: run-tests
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/node-build-action@02ffec745cddf67291d0b28f64bd81990cae327f  # v0.2.4
        # The NO_BLOCK/soft-fail pattern: setting the
        # test_permit_fail input, or the NO_BLOCK_AUDIT_FAIL
        # repository variable (an org/repo-wide override that
        # soft-fails these checks even when the caller passes
        # false), disables failure propagation.
        # yamllint disable-line rule:line-length
        continue-on-error: ${{ inputs.test_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        with:
          node_version: ${{ needs.node-metadata.outputs.test_node_version }}
          build_tool: ${{ needs.node-metadata.outputs.build_tool }}
          path_prefix: ${{ inputs.path_prefix }}
          scripts: ${{ inputs.test_script }}
          # Missing scripts warn and skip (npm --if-present parity)
          exit_on_fail: 'false'

      - name: 'Report permitted test failure'
        # Explicitly gated on the permit condition: without it a real
        # (blocking) failure would already fail the job, but keep the
        # intent unambiguous
        # yamllint disable-line rule:line-length
        if: ${{ steps.run-tests.outcome == 'failure' && (inputs.test_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true') }}
        shell: bash
        run: |
          # Report permitted test failure
          echo "::warning::Tests failed, but failures are" \
            "permitted so the job will not fail."

      - name: 'Upload test artefacts'
        if: ${{ !cancelled() && inputs.test_artifact_path != '' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: node-test-results
          path: ${{ inputs.path_prefix }}/${{ inputs.test_artifact_path }}
          retention-days: 7
          if-no-files-found: warn

      # Test reporting. The Run tests step alone decides pass or fail
      # (honouring test_permit_fail), so these steps never fail the
      # job on results; they run after a failed test step too, when
      # the reports matter most. A missing report warns: tests that
      # crash before writing one already fail the Run tests step.
      # Artefact names: a per-leg '-node-<version>' suffix belongs on
      # node-junit and node-coverage if this job fans out over
      # several Node.js versions, as uploads in one run need distinct
      # names.
      - name: 'Summarise JUnit test results'
        id: junit
        if: ${{ !cancelled() && inputs.junit_report_path != '' }}
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/junit-test-report-action@cbc41af8f2e0cf6363d5b04df00025f938bf9a5e  # v0.0.2
        with:
          # yamllint disable-line rule:line-length
          report-paths: ${{ inputs.path_prefix }}/${{ inputs.junit_report_path }}
          fail-on-failure: 'false'
          artifact-name: 'node-junit'

      - name: 'Report missing JUnit reports'
        if: ${{ !cancelled() && steps.junit.outputs.result == 'none' }}
        shell: bash
        env:
          JUNIT_REPORT_PATH: ${{ inputs.junit_report_path }}
        run: |
          # Report missing JUnit reports
          echo "::warning::No JUnit reports match junit_report_path" \
            "${JUNIT_REPORT_PATH}"

      - name: 'Summarise coverage'
        id: coverage
        if: ${{ !cancelled() && inputs.coverage_path != '' }}
        shell: bash
        working-directory: ${{ inputs.path_prefix }}
        env:
          COVERAGE_PATH: ${{ inputs.coverage_path }}
        run: |
          # Summarise coverage (reporting only: no thresholds)
          target="${COVERAGE_PATH%/}"
          summary=''
          lcov=''
          if [ -d "${target}" ]; then
            if [ -f "${target}/coverage-summary.json" ]; then
              summary="${target}/coverage-summary.json"
            fi
            if [ -f "${target}/lcov.info" ]; then
              lcov="${target}/lcov.info"
            fi
          elif [ -f "${target}" ]; then
            case "${target}" in
              *.json) summary="${target}" ;;
              *) lcov="${target}" ;;
            esac
          else
            echo "::warning::No coverage report at coverage_path" \
              "${COVERAGE_PATH}"
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The path exists, so it is uploaded whatever its format
          echo 'found=true' >> "$GITHUB_OUTPUT"

          # Each parser prints one 'metric<TAB>covered<TAB>total' row
          # per metric it knows, and fails on input it cannot read
          parse_summary() {
            # istanbul json-summary: totals sit under .total, and a
            # metric short of numeric counts makes the file unreadable
            jq -r '
              .total as $t
              | ("lines", "branches", "functions", "statements") as $m
              | $t[$m] as $v
              | if ($v | type) == "object"
                  and ($v.covered | type) == "number"
                  and ($v.total | type) == "number"
                then [$m, $v.covered, $v.total] | @tsv
                else error("no numeric total.\($m)") end' "$1"
          }
          parse_lcov() {
            # Sum each record's totals; lcov has no statement count
            awk -F: '
              { sub(/\r$/, "") }
              $1 == "SF" { records++ }
              $1 == "LF" { lf += $2 } $1 == "LH" { lh += $2 }
              $1 == "BRF" { brf += $2 } $1 == "BRH" { brh += $2 }
              $1 == "FNF" { fnf += $2 } $1 == "FNH" { fnh += $2 }
              END {
                if (!records) exit 1
                printf "lines\t%d\t%d\n", lh, lf
                printf "branches\t%d\t%d\n", brh, brf
                printf "functions\t%d\t%d\n", fnh, fnf
              }' "$1"
          }
          if [ -n "${summary}" ] \
            && rows="$(parse_summary "${summary}")"; then
            report="${summary}"
          elif [ -n "${lcov}" ] && rows="$(parse_lcov "${lcov}")"; then
            report="${lcov}"
          else
            echo "::warning::No readable lcov.info or" \
              "coverage-summary.json at coverage_path ${COVERAGE_PATH}"
            exit 0
          fi

          table="$(awk -F'\t' '{
            pct = ($3 > 0) ? sprintf("%.2f%%", 100 * $2 / $3) : "n/a"
            printf "| %s%s | %d | %d | %s |\n",
              toupper(substr($1, 1, 1)), substr($1, 2), $2, $3, pct
          }' <<< "${rows}")"
          {
            echo '## 📊 Coverage'
            echo ''
            echo "From \`${report}\`"
            echo ''
            echo '| Metric | Covered | Total | Coverage |'
            echo '| ------ | ------- | ----- | -------- |'
            echo "${table}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 'Upload coverage artefact'
        if: ${{ !cancelled() && steps.coverage.outputs.found == 'true' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: 'node-coverage'
          path: ${{ inputs.path_prefix }}/${{ inputs.coverage_path }}
          retention-days: 7
          if-no-files-found: warn

  audit:
    name: 'Audit'
    runs-on: ubuntu-latest
    needs:
      - 'node-metadata'
      - 'build'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.audit_enabled }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.audit_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # node-audit-action synthesizes a lockfile when the project
      # lacks one, so legacy projects still get audit coverage
      - name: 'Audit dependencies'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/node-audit-action@e2fb529140ff803c457451f16c2bc12107e1a5d3  # v0.0.3
        with:
          path_prefix: ${{ inputs.path_prefix }}
          node_version: ${{ needs.node-metadata.outputs.node_version }}
          audit_level: ${{ inputs.audit_level }}
          production_only: ${{ inputs.production_only }}
          # The NO_BLOCK/soft-fail pattern: setting the
          # audit_permit_fail input, or the NO_BLOCK_AUDIT_FAIL
          # repository variable (an org/repo-wide override that
          # soft-fails these checks even when the caller passes
          # false), disables failure propagation.
          # yamllint disable-line rule:line-length
          permit_fail: ${{ inputs.audit_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}

  sbom:
    name: 'Generate SBOM'
    runs-on: ubuntu-latest
    needs: 'build'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.sbom_enabled }}
    timeout-minutes: ${{ inputs.audit_timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Emits sbom-cyclonedx.json at the workspace root (the Grype
      # job contract)
      - name: 'Generate SBOM'
        id: sbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/sbom-action@58b6094cf67d072d6eb772590c43ee52c8c69bb6  # v0.2.0
        with:
          path_prefix: ${{ inputs.path_prefix }}
          filename_prefix: 'sbom-cyclonedx'
          output_directory: '.'
          include_dev: 'false'

      - name: 'Upload SBOM artifacts'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-files
          # Glob matches whichever SBOM formats the generator produced
          path: sbom-cyclonedx.*
          retention-days: 45
          # Fail fast: the downstream Grype job requires this artifact,
          # so a missing/misnamed SBOM must surface here, not later
          if-no-files-found: error

      - name: 'SBOM summary'
        shell: bash
        env:
          COMPONENT_COUNT: ${{ steps.sbom.outputs.component_count }}
        run: |
          # SBOM summary
          {
            echo "## SBOM Summary"
            echo "CycloneDX SBOM with ${COMPONENT_COUNT} components"
          } >> "$GITHUB_STEP_SUMMARY"

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    needs: 'sbom'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.sbom.result == 'success' && inputs.grype_enabled }}
    timeout-minutes: ${{ inputs.audit_timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-files

      # Setting the grype_permit_fail input, or the NO_BLOCK_AUDIT_FAIL
      # repository variable (an org/repo-wide override that soft-fails
      # this check even when the caller passes false), disables failure
      # propagation so pull requests
      # can proceed when blocked by newly discovered CVEs in transitive
      # dependencies.
      - name: 'Grype audit SBOM'
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@9a85f35a26a71dafb2fa23a6f83a640d526ee559  # v0.2.0
        with:
          sbom: 'sbom-cyclonedx.json'
          fail-on: ${{ inputs.grype_fail_on }}
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
