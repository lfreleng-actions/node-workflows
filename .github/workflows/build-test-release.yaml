---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Node.js build/test/release pipeline (Model A: tag-driven).
#
# Reproduces the canonical Linux Foundation release pipeline shape. The
# repository-metadata job runs in parallel as an informational step;
# node-metadata resolves the effective Node.js version and build tool.
# After build the audit jobs in { } run in parallel; the tests then gate
# on ALL of them (gating inversion: on releases the audits gate the
# expensive test matrix), and publishing runs at the end:
#   tag-validate -> build -> { audit | sbom -> grype } -> tests
#     -> attach-artefacts -> nexus-publish -> promote-release
# The sign-artefacts job (Sigstore keyless) runs after build when the
# sigstore_sign input enables it; nexus-publish runs when the
# nexus_publish input enables it, and the release stays a draft until
# every publish leg succeeds.
#
# Call this from a thin caller workflow on a tag push; see
# examples/build-test-release/ for both a plain GitHub-native caller and
# a Gerrit-wrapped caller.
name: '[R] Node.js Build/Test/Release'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: >-
          Branch/tag/SHA to check out. Empty uses the triggering
          event's ref for same-repository checkouts, or the default
          branch when checking out a different repository.
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Node.js toolchain ---
      node_version:
        description: >-
          Node.js version to use. Empty (the default) auto-detects a
          plain engines.node version from package.json and otherwise
          falls back to the current default (22).
        required: false
        type: string
        default: ''
      build_node_version:
        description: >-
          Node.js version for jobs that run the project's own
          toolchain. Empty (the default) follows node_version. Set
          this when a legacy dependency tree caps the build below the
          version the pack/publish jobs need.
        required: false
        type: string
        default: ''
      test_node_version:
        description: >-
          Node.js version for the test job. Empty (the default)
          follows node_version. Projects needing build_node_version
          often test on a newer toolchain than they build on.
        required: false
        type: string
        default: ''
      build_tool:
        description: >-
          Build tool: 'npm' or 'yarn'. Empty (the default) auto-detects
          the package manager from the project lockfile/metadata and
          otherwise falls back to npm.
        required: false
        type: string
        default: ''

      # --- Build ---
      build_scripts:
        description: 'package.json script(s) the build job runs'
        required: false
        type: string
        default: 'build'

      # --- Tests ---
      tests_enabled:
        description: 'Run the tests job (set false to skip tests)'
        required: false
        type: boolean
        default: true
      test_script:
        description: >-
          package.json script(s) the tests job runs; accepts a comma,
          space or newline separated list
        required: false
        type: string
        default: 'test'
      test_permit_fail:
        description: 'Permit test failures without failing the workflow'
        required: false
        type: boolean
        default: false
      test_artifact_path:
        description: >-
          Path (relative to path_prefix) of test output/reports to
          upload as a workflow artefact; empty disables the upload
        required: false
        type: string
        default: ''

      # --- Audit ---
      audit_enabled:
        description: 'Run the dependency audit job (set false to skip)'
        required: false
        type: boolean
        default: true
      audit_level:
        description: >-
          npm audit severity threshold that fails the audit: 'info',
          'low', 'moderate', 'high' or 'critical'
          (matches the node-audit-action default)
        required: false
        type: string
        default: 'high'
      production_only:
        description: 'Audit production dependencies only'
        required: false
        type: boolean
        default: false
      audit_permit_fail:
        description: 'Permit dependency audit failures (the NO_BLOCK pattern)'
        required: false
        type: boolean
        default: false

      # --- SBOM/Grype scan ---
      sbom_enabled:
        description: >-
          Generate an SBOM (set false to skip). The Grype scan
          reads the SBOM, so skipping generation leaves it nothing to
          scan. To keep the SBOM but drop the scan, use grype_enabled.
        required: false
        type: boolean
        default: true
      grype_enabled:
        description: >-
          Run the Grype vulnerability scan over the generated SBOM (set
          false to skip). Decoupling is one-way: disabling the scan
          keeps the SBOM, but disabling the SBOM also stops the scan,
          which has nothing to read.
        required: false
        type: boolean
        default: true
      grype_fail_on:
        description: 'Minimum severity that fails the Grype scan'
        required: false
        type: string
        default: 'medium'
      grype_permit_fail:
        description: >-
          Permit Grype findings without failing the job. When false, falls
          back to the NO_BLOCK_AUDIT_FAIL repository variable at runtime.
        required: false
        type: boolean
        default: false

      # --- Job timeouts ---
      build_timeout_minutes:
        description: 'Timeout (minutes) for the build job'
        required: false
        type: number
        default: 12
      test_timeout_minutes:
        description: 'Timeout (minutes) for the tests job'
        required: false
        type: number
        default: 12
      audit_timeout_minutes:
        description: 'Timeout (minutes) for the audit, SBOM and Grype jobs'
        required: false
        type: number
        default: 10

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      build_permit_egress_traffic:
        description: >
          Run harden-runner in audit mode for the build job only,
          permitting unrestricted egress. Use when the build fetches
          dependencies from CDNs that are impractical to enumerate in the
          allow-list. Other jobs stay governed by harden_runner_egress;
          left unset, the build job follows it too.
        required: false
        type: boolean
        default: false
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@e0e35011ee145321a51d3226f044ec88dfe645b1'  # v0.16.4

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

      # --- Release-only inputs ---
      attestations:
        description: >-
          Generate SLSA build provenance attestations for the packed
          npm tarball (verifiable with `gh attestation verify`). Keep
          it toggleable for air-gapped or Gerrit-mirrored consumers
          that cannot reach Sigstore.
        required: false
        type: boolean
        default: true
      sigstore_sign:
        description: >-
          Sign the packed npm tarball with Sigstore (keyless/OIDC),
          producing a .sigstore.json bundle attached to the GitHub
          release (verifiable with `cosign verify-blob --bundle`). Keep
          it toggleable for air-gapped or Gerrit-mirrored consumers
          that cannot reach Sigstore.
        required: false
        type: boolean
        default: true

      # --- Nexus/registry publishing ---
      nexus_publish:
        description: >-
          Publish the package to one or more npm registries before the
          GitHub release promotes, which waits on every publish; requires
          the OP_SERVICE_ACCOUNT_TOKEN and VAULT_MAPPING_JSON secrets
        required: false
        type: boolean
        default: false
      publish_targets:
        description: >-
          JSON array of publish targets, each with 'name',
          'registry_url' and 'auth' ('nexus' or 'token'), optionally
          'credential_name'. Targets publish in parallel and fail
          independently. Leave unset to fall back to registry_url; an
          empty array [] is rejected, not a fallback.
        required: false
        type: string
        default: ''
      registry_url:
        description: >-
          Single npm registry URL that receives the publish, e.g.
          https://nexus3.example.org/repository/npm.release/
          Deprecated: prefer publish_targets.
        required: false
        type: string
        default: ''
      nexus_user:
        description: >-
          Nexus username override; empty derives the username from the
          repository name (the 1Password credential naming contract)
        required: false
        type: string
        default: ''
      npm_tag:
        description: 'npm dist-tag applied to the published version'
        required: false
        type: string
        default: 'latest'
      npm_access:
        description: >-
          npm publish access: 'public' or 'restricted'; empty keeps the
          registry default
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Run the Nexus publish steps without uploading'
        required: false
        type: boolean
        default: false

    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: >-
          1Password service-account token used by credential-load-action
          to fetch the per-repository Nexus credential from the common
          per-org CI/CD vault (op://<vault>/<repository-name>/password).
          Only needed when nexus_publish is true.
        required: false
      VAULT_MAPPING_JSON:
        description: >-
          Base64-encoded JSON mapping of organisation name to 1Password
          vault ID, keyed on github.repository_owner; consumed by
          credential-load-action to resolve the correct vault. Only
          needed when nexus_publish is true.
        required: false

    outputs:
      tag:
        description: 'Validated release tag/version string'
        value: ${{ jobs.tag-validate.outputs.tag }}

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Workflow Inputs'
    # Fails fast with a clear message on invalid workflow inputs: the
    # test artefact path, job timeouts, and the Gerrit parameters (when
    # gerrit_refspec is set without the project/branch the Gerrit
    # checkout path also requires). The build-chain root job depends on
    # this, so invalid inputs stop the pipeline early and cleanly. This
    # job always runs (only some validation steps are conditional), so
    # gating dependents on it does not trip GitHub's "skipped need
    # skips dependents" behaviour.
    # The job carries no harden-runner step by design: it performs pure
    # input-string validation with no checkout, artifacts or network
    # access, and loading the egress allow-list would itself add an
    # outbound call.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Validate path_prefix input'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # Require a relative, non-traversing path: later jobs cd
          # into it and derive packaging/publish paths from it, so
          # absolute paths or .. segments could escape the checkout
          # A single trailing slash is tolerated ('./' == '.',
          # 'subdir/' == 'subdir')
          PATH_PREFIX="${PATH_PREFIX%/}"
          if [ "${PATH_PREFIX}" = '.' ]; then
            exit 0
          fi
          if [[ ! "${PATH_PREFIX}" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] \
            || [[ "${PATH_PREFIX}" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid path_prefix input: ${PATH_PREFIX}"
            exit 1
          fi

      - name: 'Validate test_artifact_path input'
        if: inputs.test_artifact_path != ''
        shell: bash
        env:
          TEST_ARTIFACT_PATH: ${{ inputs.test_artifact_path }}
        run: |
          # Require a relative, non-traversing path (the * wildcard
          # permitted): the tests job joins it onto path_prefix for
          # the artefact upload, so absolute paths or .. segments
          # could pull in files from outside the checkout
          valid='^[A-Za-z0-9._*-]+(/[A-Za-z0-9._*-]+)*/?$'
          if [[ ! "${TEST_ARTIFACT_PATH}" =~ ${valid} ]] \
            || [[ "${TEST_ARTIFACT_PATH}" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid test_artifact_path input:" \
              "${TEST_ARTIFACT_PATH}"
            exit 1
          fi

      - name: 'Validate job timeout inputs'
        shell: bash
        env:
          BUILD_TIMEOUT: ${{ inputs.build_timeout_minutes }}
          TEST_TIMEOUT: ${{ inputs.test_timeout_minutes }}
          AUDIT_TIMEOUT: ${{ inputs.audit_timeout_minutes }}
        run: |
          # Require whole-minute timeouts in the range 1-360 (the
          # GitHub-hosted runner job cap). Values GitHub itself
          # rejects (e.g. fractional numbers) can fail workflow
          # evaluation before this step runs; for values that do
          # reach it (zero, negative or out-of-range), this gives a
          # clear fail-fast error
          error=0
          for entry in \
            "build_timeout_minutes=${BUILD_TIMEOUT}" \
            "test_timeout_minutes=${TEST_TIMEOUT}" \
            "audit_timeout_minutes=${AUDIT_TIMEOUT}"; do
            name="${entry%%=*}"; value="${entry#*=}"
            if [[ ! "${value}" =~ ^[0-9]+$ ]] \
              || [ "${value}" -lt 1 ] || [ "${value}" -gt 360 ]; then
              echo "::error::Invalid ${name} input: ${value}"
              error=1
            fi
          done
          exit "${error}"

      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@847400e0d0b34cc88a572fa9575accd80401b796  # v0.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  node-metadata:
    name: 'Node.js Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.resolve.outputs.node_version }}
      build_tool: ${{ steps.resolve.outputs.build_tool }}
      # yamllint disable-line rule:line-length
      build_node_version: ${{ steps.resolve.outputs.build_node_version }}
      # yamllint disable-line rule:line-length
      test_node_version: ${{ steps.resolve.outputs.test_node_version }}
      # yamllint disable-line rule:line-length
      has_lock_file: ${{ steps.build-metadata.outputs.javascript_has_lock_file }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Gather Node.js build metadata'
        id: build-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/build-metadata-action@ef53139abdf48a63b097efc740202c140571b0d4  # v0.8.3
        with:
          path_prefix: ${{ inputs.path_prefix }}
          artifact_upload: 'false'

      - name: 'Resolve Node.js version and build tool'
        id: resolve
        shell: bash
        env:
          NODE_VERSION_INPUT: ${{ inputs.node_version }}
          BUILD_NODE_VERSION_INPUT: ${{ inputs.build_node_version }}
          TEST_NODE_VERSION_INPUT: ${{ inputs.test_node_version }}
          BUILD_TOOL_INPUT: ${{ inputs.build_tool }}
          # yamllint disable-line rule:line-length
          DETECTED_PACKAGE_MANAGER: ${{ steps.build-metadata.outputs.javascript_package_manager }}
          # yamllint disable-line rule:line-length
          DETECTED_REQUIRES_NODE: ${{ steps.build-metadata.outputs.javascript_requires_node }}
        run: |
          # Resolve the effective Node.js version and build tool:
          # explicit inputs win, then metadata detection, then defaults
          node_version="${NODE_VERSION_INPUT}"
          # Constrain caller input to the character set the downstream
          # setup/audit/publish actions accept, and keep the value safe
          # to write to $GITHUB_OUTPUT
          if [ -n "${node_version}" ] &&
            [[ ! "${node_version}" =~ ^[A-Za-z0-9./*_-]+$ ]]; then
            echo "::error::Invalid node_version input:" \
              "$(printf '%s' "${node_version}" | tr -d '\r\n')"
            exit 1
          fi
          if [ -z "${node_version}" ]; then
            # Use the engines.node constraint when it names a plain
            # version; downstream actions reject range syntax (>=18)
            if [[ "${DETECTED_REQUIRES_NODE}" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]
            then
              node_version="${DETECTED_REQUIRES_NODE}"
            elif [ -n "${DETECTED_REQUIRES_NODE}" ]; then
              echo "::notice::engines.node constraint" \
                "'${DETECTED_REQUIRES_NODE}' is not a plain version;" \
                "using the default Node.js version"
            fi
          fi
          if [ -z "${node_version}" ]; then
            node_version='22'
          fi
          build_tool="${BUILD_TOOL_INPUT}"
          case "${build_tool}" in
            npm|yarn) ;;
            '')
              case "${DETECTED_PACKAGE_MANAGER}" in
                npm|yarn)
                  build_tool="${DETECTED_PACKAGE_MANAGER}"
                  ;;
                '')
                  build_tool='npm'
                  ;;
                *)
                  echo "::notice::Detected package manager" \
                    "'${DETECTED_PACKAGE_MANAGER}' lacks" \
                    "node-build-action support; using npm"
                  build_tool='npm'
                  ;;
              esac
              ;;
            *)
              echo "::error::Invalid build_tool input: ${build_tool}" \
                "(must be 'npm' or 'yarn')"
              exit 1
              ;;
          esac
          # Jobs that run the project's own toolchain can need a
          # different Node.js from the pack/publish jobs, which only
          # need a modern npm and never rebuild. A legacy dependency
          # tree can cap the first well below what the second
          # requires, leaving no single version that satisfies both.
          # Empty follows node_version, so this costs nothing unless
          # a caller needs the split.
          build_node_version="${BUILD_NODE_VERSION_INPUT}"
          if [ -n "${build_node_version}" ] &&
            [[ ! "${build_node_version}" =~ ^[A-Za-z0-9./*_-]+$ ]]; then
            echo "::error::Invalid build_node_version input:" \
              "$(printf '%s' "${build_node_version}" \
                | tr -d '\r\n')"
            exit 1
          fi
          if [ -z "${build_node_version}" ]; then
            build_node_version="${node_version}"
          fi
          test_node_version="${TEST_NODE_VERSION_INPUT}"
          if [ -n "${test_node_version}" ] &&
            [[ ! "${test_node_version}" =~ ^[A-Za-z0-9./*_-]+$ ]]; then
            echo "::error::Invalid test_node_version input:" \
              "$(printf '%s' "${test_node_version}" \
                | tr -d '\r\n')"
            exit 1
          fi
          if [ -z "${test_node_version}" ]; then
            test_node_version="${node_version}"
          fi
          echo "Resolved Node.js version: ${node_version}"
          echo "Resolved build tool: ${build_tool}"
          echo "Build toolchain Node.js version: ${build_node_version}"
          echo "Test Node.js version: ${test_node_version}"
          {
            echo "node_version=${node_version}"
            echo "build_tool=${build_tool}"
            echo "build_node_version=${build_node_version}"
            echo "test_node_version=${test_node_version}"
          } >> "$GITHUB_OUTPUT"

  tag-validate:
    name: 'Validate Tag Push'
    needs: gerrit-validate
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write  # Needed to draft a release
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag-validate.outputs.tag_name }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 'Verify pushed tag'
        id: 'tag-validate'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/tag-validate-action@63470621b8ebc5c4fc86ebb616727dd0a7285dd9  # v1.1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          require_type: 'semver'
          reject_development: 'true'
          require_github: 'true'
          # yamllint disable-line rule:line-length
          require_signed: 'ssh,gpg-unverifiable'  # Cannot verify GPG without key

      - name: 'Ensure draft release exists'
        id: 'ensure-release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag-validate.outputs.tag_name }}
        run: |
          # Ensure draft release exists
          # Check if release exists and get its draft status
          if RELEASE_INFO=$(gh release view "$TAG" \
            --json isDraft 2>/dev/null); then
            IS_DRAFT=$(echo "$RELEASE_INFO" | jq -r '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Draft release for tag $TAG already exists"
            else
              echo "::error::A published release already exists for $TAG;" \
                "delete or recreate it as a draft, then re-run."
              exit 1
            fi
          else
            echo "Creating draft release for tag $TAG"
            gh release create "$TAG" \
              --draft \
              --title "Release $TAG" \
              --notes "Automated release for $TAG"
          fi

  build:
    name: 'Build'
    needs:
      - 'tag-validate'
      - 'node-metadata'
    runs-on: 'ubuntu-latest'
    outputs:
      artefact_name: ${{ steps.build.outputs.artefact_name }}
      artefact_path: ${{ steps.build.outputs.artefact_path }}
      tarball_name: ${{ steps.build.outputs.tarball_name }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    steps:
      # The build job can opt into audit egress independently of the
      # other jobs via build_permit_egress_traffic, for dependency
      # fetches from CDNs impractical to enumerate in the allow-list.
      # Left unset it follows harden_runner_egress like every other job.
      #
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever a
      # step-level 'if:' says. Both would engage the agent, the first
      # would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.build_permit_egress_traffic || inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Explicit toolchain setup so the stamp/pack steps run on the
      # resolved Node.js version rather than whatever the runner image
      # happens to carry
      # node_version, not build_node_version: this toolchain serves
      # the stamp below, which is a metadata edit rather than a
      # compile. The build step selects its own version, and the
      # packaging step re-selects this one afterwards.
      - name: 'Set up Node.js'
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ needs.node-metadata.outputs.node_version }}

      # Stamp package.json BEFORE the build so build outputs that
      # embed the package version (banners, generated metadata) match
      # the version the tarball ships with
      - name: 'Stamp release version'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          TAG: ${{ needs.tag-validate.outputs.tag }}
        run: |
          # Constrain path_prefix to a relative, non-traversing path
          # before cd (rejects absolute paths and .. segments)
          if [[ ! "${PATH_PREFIX}" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] \
            || [[ "${PATH_PREFIX}" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid path_prefix input: ${PATH_PREFIX}"
            exit 1
          fi
          # Stamp package.json with the validated tag version.
          #
          # This is the only stamp in the release path. The publish
          # job hands npm this archive through tarball_path, so the
          # action skips its own stamp and verifies that the tarball
          # already declares publish_version. The pack-release job in
          # merge.yaml does the same for that lane; see #58.
          #
          # --ignore-scripts: dependencies are not installed at this
          # point, so preversion/version/postversion hooks cannot
          # reliably run here or in the action.
          #
          # --no-workspaces: with workspaces enabled in configuration,
          # 'npm version' stamps the workspace children and leaves the
          # target at its committed version.
          cd "${PATH_PREFIX}"
          version="${TAG#v}"
          npm version --no-git-tag-version --allow-same-version \
            --ignore-scripts --no-workspaces "${version}"

      - name: 'Build project'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/node-build-action@02ffec745cddf67291d0b28f64bd81990cae327f  # v0.2.4
        with:
          node_version: ${{ needs.node-metadata.outputs.build_node_version }}
          build_tool: ${{ needs.node-metadata.outputs.build_tool }}
          path_prefix: ${{ inputs.path_prefix }}
          scripts: ${{ inputs.build_scripts }}

      # node-build-action runs setup-node itself, so the build leaves
      # build_node_version on PATH. Packing happens in this same job
      # and needs 'npm pack --pack-destination', which arrived in npm
      # 7 -- the very constraint build_node_version exists to escape.
      # Without this the split would appear to work and the release
      # lane would still fail with 'npm pack produced no tarball'.
      - name: 'Restore the publish Node.js'
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ needs.node-metadata.outputs.node_version }}

      - name: 'Pack release tarball'
        id: build
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # Constrain path_prefix to a relative, non-traversing,
          # single-line path before it reaches $GITHUB_OUTPUT
          # (output-file injection) or drives packaging paths
          if [[ ! "${PATH_PREFIX}" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] \
            || [[ "${PATH_PREFIX}" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid path_prefix input: ${PATH_PREFIX}"
            exit 1
          fi
          # Produce the release tarball via npm pack (package.json
          # already carries the stamped release version).
          #
          # --no-workspaces for the same reason as the stamp above:
          # with workspaces enabled in configuration, npm pack packs
          # the workspace children rather than the target, so the
          # release would carry tarballs nobody asked for.
          #
          # This archive is the release artefact: attest and
          # sign-artefacts cover it, and nexus-publish publishes it
          # rather than packing a second one, so there is no
          # prepublishOnly divergence left to document; see #85.
          cd "${PATH_PREFIX}"
          mkdir -p pack-dist
          tarball=$(npm pack --no-workspaces \
            --pack-destination pack-dist | tail -n1)
          if [ ! -f "pack-dist/${tarball}" ]; then
            echo "::error::npm pack produced no tarball"
            exit 1
          fi
          echo "Packed release tarball: ${tarball}"
          {
            echo "artefact_name=node-release-package"
            echo "artefact_path=${PATH_PREFIX}/pack-dist"
            echo "tarball_name=${tarball}"
          } >> "$GITHUB_OUTPUT"

      - name: 'Upload build artefact'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.build.outputs.artefact_name }}
          path: ${{ steps.build.outputs.artefact_path }}
          if-no-files-found: error

  audit:
    name: 'Audit'
    runs-on: ubuntu-latest
    needs:
      - 'node-metadata'
      - 'build'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.audit_enabled }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.audit_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # node-audit-action synthesizes a lockfile when the project
      # lacks one, so legacy projects still get audit coverage
      - name: 'Audit dependencies'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/node-audit-action@e2fb529140ff803c457451f16c2bc12107e1a5d3  # v0.0.3
        with:
          path_prefix: ${{ inputs.path_prefix }}
          node_version: ${{ needs.node-metadata.outputs.node_version }}
          audit_level: ${{ inputs.audit_level }}
          production_only: ${{ inputs.production_only }}
          # The NO_BLOCK/soft-fail pattern: setting the
          # audit_permit_fail input, or the NO_BLOCK_AUDIT_FAIL
          # repository variable (an org/repo-wide override that
          # soft-fails these checks even when the caller passes
          # false), disables failure propagation.
          # yamllint disable-line rule:line-length
          permit_fail: ${{ inputs.audit_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}

  sbom:
    name: 'Generate SBOM'
    runs-on: ubuntu-latest
    needs: 'build'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.sbom_enabled }}
    timeout-minutes: ${{ inputs.audit_timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Emits sbom-cyclonedx.json at the workspace root (the Grype
      # job contract)
      - name: 'Generate SBOM'
        id: sbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/sbom-action@58b6094cf67d072d6eb772590c43ee52c8c69bb6  # v0.2.0
        with:
          path_prefix: ${{ inputs.path_prefix }}
          filename_prefix: 'sbom-cyclonedx'
          output_directory: '.'
          include_dev: 'false'

      - name: 'Upload SBOM artifacts'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-files
          # Glob matches whichever SBOM formats the generator produced
          path: sbom-cyclonedx.*
          retention-days: 45
          # Fail fast: the downstream Grype job requires this artifact,
          # so a missing/misnamed SBOM must surface here, not later
          if-no-files-found: error

      - name: 'SBOM summary'
        shell: bash
        env:
          COMPONENT_COUNT: ${{ steps.sbom.outputs.component_count }}
        run: |
          # SBOM summary
          {
            echo "## SBOM Summary"
            echo "CycloneDX SBOM with ${COMPONENT_COUNT} components"
          } >> "$GITHUB_STEP_SUMMARY"

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    needs: 'sbom'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.sbom.result == 'success' && inputs.grype_enabled }}
    timeout-minutes: ${{ inputs.audit_timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-files

      # Setting the grype_permit_fail input, or the NO_BLOCK_AUDIT_FAIL
      # repository variable (an org/repo-wide override that soft-fails
      # this check even when the caller passes false), disables failure
      # propagation so pull requests
      # can proceed when blocked by newly discovered CVEs in transitive
      # dependencies.
      - name: 'Grype audit SBOM'
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@9a85f35a26a71dafb2fa23a6f83a640d526ee559  # v0.2.0
        with:
          sbom: 'sbom-cyclonedx.json'
          fail-on: ${{ inputs.grype_fail_on }}
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: 'Tests'
    runs-on: 'ubuntu-latest'
    # Deferred until the audit operations (audit and Grype) pass, so
    # the expensive test suite is skipped when either audit step fails
    # (gating inversion: audits gate tests on releases). Disabled
    # audit/SBOM jobs report 'skipped' and do not block the tests, but
    # the direct sbom check keeps a genuine SBOM failure (which also
    # skips Grype) gating the tests as before.
    needs:
      - 'node-metadata'
      - 'build'
      - 'audit'
      - 'sbom'
      - 'grype'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.audit.result == 'success' || (needs.audit.result == 'skipped' && !inputs.audit_enabled)) && (needs.sbom.result == 'success' || (needs.sbom.result == 'skipped' && !inputs.sbom_enabled)) && (needs.grype.result == 'success' || (needs.grype.result == 'skipped' && (!inputs.grype_enabled || !inputs.sbom_enabled))) && inputs.tests_enabled }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.test_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Run tests'
        id: run-tests
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/node-build-action@02ffec745cddf67291d0b28f64bd81990cae327f  # v0.2.4
        # The NO_BLOCK/soft-fail pattern: setting the
        # test_permit_fail input, or the NO_BLOCK_AUDIT_FAIL
        # repository variable (an org/repo-wide override that
        # soft-fails these checks even when the caller passes
        # false), disables failure propagation.
        # yamllint disable-line rule:line-length
        continue-on-error: ${{ inputs.test_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        with:
          node_version: ${{ needs.node-metadata.outputs.test_node_version }}
          build_tool: ${{ needs.node-metadata.outputs.build_tool }}
          path_prefix: ${{ inputs.path_prefix }}
          scripts: ${{ inputs.test_script }}
          # Missing scripts warn and skip (npm --if-present parity)
          exit_on_fail: 'false'

      - name: 'Report permitted test failure'
        # Explicitly gated on the permit condition: without it a real
        # (blocking) failure would already fail the job, but keep the
        # intent unambiguous
        # yamllint disable-line rule:line-length
        if: ${{ steps.run-tests.outcome == 'failure' && (inputs.test_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true') }}
        shell: bash
        run: |
          # Report permitted test failure
          echo "::warning::Tests failed, but failures are" \
            "permitted so the job will not fail."

      - name: 'Upload test artefacts'
        if: ${{ !cancelled() && inputs.test_artifact_path != '' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: node-test-results
          path: ${{ inputs.path_prefix }}/${{ inputs.test_artifact_path }}
          retention-days: 7
          if-no-files-found: warn

  attest:
    name: 'Attest Build Provenance'
    runs-on: 'ubuntu-latest'
    needs: 'build'
    # A dedicated job so id-token/attestations grants stay scoped to
    # attestation work and never apply when the toggle is off
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.attestations }}
    permissions:
      contents: read
      id-token: write       # Needed for attestations
      attestations: write   # Needed for attestations
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: '⬇ Download build artefacts'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.build.outputs.artefact_name }}
          path: 'attest'

      # SLSA build provenance for the packed tarball; consumers verify
      # with `gh attestation verify <tarball> --repo <owner/repo>`.
      #
      # actions/attest rather than actions/attest-build-provenance: as
      # of v4 the latter is a thin wrapper that forwards its inputs to
      # the former, and GitHub directs new implementations to
      # actions/attest. With no predicate supplied it emits SLSA build
      # provenance by default.
      #
      # The wrapper is not quite empty: it also sets
      # NODE_OPTIONS=--max-http-header-size=32768, added upstream for
      # header overflow when pushing attestations to an OCI registry.
      # This job sets no push-to-registry, so that has no bearing here.
      - name: 'Attest build provenance'
        # yamllint disable-line rule:line-length
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: attest/${{ needs.build.outputs.tarball_name }}

  sign-artefacts:
    name: 'Sign Artefacts'
    runs-on: 'ubuntu-latest'
    needs: 'build'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && inputs.sigstore_sign && needs.build.result == 'success' }}
    permissions:
      contents: read
      id-token: write  # Sigstore keyless/OIDC signing
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: '⬇ Download build artefacts'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.build.outputs.artefact_name }}
          path: 'signing'

      - name: 'Install cosign'
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Keyless signing against the public Sigstore infrastructure;
      # consumers verify with `cosign verify-blob --bundle`
      - name: 'Sign tarball with Sigstore'
        shell: bash
        env:
          TARBALL: ${{ needs.build.outputs.tarball_name }}
        run: |
          # Sign the release tarball (keyless), emitting a bundle
          cd signing
          cosign sign-blob --yes \
            --bundle "${TARBALL}.sigstore.json" \
            "${TARBALL}"

      - name: 'Upload Sigstore bundle'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: 'sigstore-bundle'
          path: 'signing/*.sigstore.json'
          retention-days: 45
          if-no-files-found: error

  attach-artefacts:
    name: 'Attach Artefacts to Release'
    runs-on: 'ubuntu-latest'
    needs:
      - 'tag-validate'
      - 'build'
      - 'audit'
      - 'sbom'
      - 'grype'
      - 'tests'
      - 'attest'
      - 'sign-artefacts'
    # attest/sign-artefacts skip when their toggles are off, and
    # tests/audit/sbom skip when their enable toggles are false;
    # tolerate skipped results, but never a failure (a failed audit,
    # SBOM or Grype scan blocks the release here)
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.tests.result) && (needs.audit.result == 'success' || (needs.audit.result == 'skipped' && !inputs.audit_enabled)) && (needs.sbom.result == 'success' || (needs.sbom.result == 'skipped' && !inputs.sbom_enabled)) && (needs.grype.result == 'success' || (needs.grype.result == 'skipped' && (!inputs.grype_enabled || !inputs.sbom_enabled))) && (needs.attest.result == 'success' || needs.attest.result == 'skipped') && (needs.sign-artefacts.result == 'success' || needs.sign-artefacts.result == 'skipped') }}
    permissions:
      contents: write  # IMPORTANT: needed to edit release, attach artefacts
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: '⬇ Download build artefacts'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.build.outputs.artefact_name }}
          path: ${{ needs.build.outputs.artefact_path }}

      - name: '⬇ Download Sigstore bundle'
        if: inputs.sigstore_sign
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: 'sigstore-bundle'
          path: ${{ needs.build.outputs.artefact_path }}

      - name: '⬇ Download SBOM artifacts'
        # Skipped when the sbom job was disabled (no artefact exists)
        if: needs.sbom.result == 'success'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: 'sbom-files'
          path: ${{ needs.build.outputs.artefact_path }}

      - name: 'Attach build artefacts to release'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/release-assets-action@51e2955cf9aeab3731efd7cc4605aa2847e7d8e2  # v0.1.3
        with:
          asset_paths: '["${{ needs.build.outputs.artefact_path }}/**"]'
          release_tag: ${{ needs.tag-validate.outputs.tag }}

  promote-release:
    name: 'Promote Draft Release'
    needs:
      - 'tag-validate'
      - 'attach-artefacts'
      - 'nexus-publish'
    # Promotion waits on every publish leg, so a registry refusing the
    # release leaves it a draft rather than announcing a version the
    # registries lack (#141). Only nexus_publish being off may skip the
    # publish: a skip from a failed resolver must stop promotion too.
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.tag-validate.result == 'success' && needs.attach-artefacts.result == 'success' && (needs.nexus-publish.result == 'success' || (needs.nexus-publish.result == 'skipped' && !inputs.nexus_publish)) }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write  # IMPORTANT: needed for draft release promotion
    timeout-minutes: 2
    outputs:
      # yamllint disable-line rule:line-length
      release_url: ${{ steps.promote-release.outputs.release_url || steps.set-promoted-url.outputs.release_url }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Check if release is already promoted'
        id: 'check-promoted'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-validate.outputs.tag }}
        run: |
          # Check if release is already promoted
          if gh release view "$TAG" --json isDraft --jq '.isDraft' \
              2>/dev/null | grep -q "false"; then
            echo "Release $TAG is already promoted, skipping promotion"
            echo "already_promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG is draft or doesn't exist, " \
                 "proceeding with promotion"
            echo "already_promoted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Promote draft release'
        id: 'promote-release'
        if: steps.check-promoted.outputs.already_promoted == 'false'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/draft-release-promote-action@e420b392557c9b1eea642f0d54dec4ff39086d5f  # v0.1.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.tag-validate.outputs.tag }}
          latest: true

      - name: 'Set release URL for already promoted release'
        id: 'set-promoted-url'
        if: steps.check-promoted.outputs.already_promoted == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-validate.outputs.tag }}
        run: |
          # Set release URL for already promoted release
          RELEASE_URL=$(gh release view "$TAG" --json url --jq '.url')
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

  # Resolve the publish target list before the publish job, so a
  # malformed targets input fails once, early, and names the offending
  # entry -- rather than failing identically in every matrix leg.
  #
  # Gated on nexus_publish, unlike merge.yaml's two resolvers: there
  # publishing always happens, whereas here it is opt-in, and the
  # resolver treats "no targets at all" as an error rather than as a
  # way to skip.
  resolve-publish-targets:
    name: 'Resolve Publish Targets'
    needs: 'tag-validate'
    if: ${{ inputs.nexus_publish }}
    permissions:
      contents: read
    uses: $/.github/workflows/publish-targets.yaml
    with:
      label: 'release'
      targets_json: ${{ inputs.publish_targets }}
      registry_url: ${{ inputs.registry_url }}

  nexus-publish:
    # The leg name comes from the target, so a failed check names the
    # registry that failed rather than leaving the reader to open it.
    name: 'Publish Release (${{ matrix.target.name }})'
    runs-on: ubuntu-latest
    needs:
      - 'tag-validate'
      - 'node-metadata'
      - 'build'
      - 'attach-artefacts'
      - 'resolve-publish-targets'
    # Publishing follows attach-artefacts, which gates on every audit,
    # test and provenance job, and precedes promotion (#141).
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && inputs.nexus_publish && needs.attach-artefacts.result == 'success' && needs.resolve-publish-targets.result == 'success' }}
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      # One registry rejecting the publish must not abandon the others:
      # the failure is per-registry, and every target published now is
      # one a re-run skips once the cause is fixed.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve-publish-targets.outputs.matrix) }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: '⬇ Download build artefacts'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.build.outputs.artefact_name }}
          path: ${{ needs.build.outputs.artefact_path }}

      - name: 'Resolve publish parameters'
        id: publish-params
        shell: bash
        env:
          TAG: ${{ needs.tag-validate.outputs.tag }}
          NEXUS_USER_INPUT: ${{ inputs.nexus_user }}
          # The repository actually checked out/published, which can
          # differ from GITHUB_REPOSITORY for cross-repository calls
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
          # Presence flags only: expressions evaluate to 'true'/'false'
          # so no secret material enters the environment
          # yamllint disable-line rule:line-length
          HAS_OP_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
          HAS_VAULT_MAPPING: ${{ secrets.VAULT_MAPPING_JSON != '' }}
        run: |
          # Derive the publish version and Nexus username
          # The registry URL is validated by resolve-publish-targets,
          # which also rejects an empty target list, so there is
          # nothing left to check for it here.
          #
          # Fail fast with an actionable message when the credential
          # secrets are missing, rather than deep inside
          # credential-load-action
          missing=''
          if [ "${HAS_OP_TOKEN}" != "true" ]; then
            missing="${missing} OP_SERVICE_ACCOUNT_TOKEN"
          fi
          if [ "${HAS_VAULT_MAPPING}" != "true" ]; then
            missing="${missing} VAULT_MAPPING_JSON"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::nexus_publish requires these workflow" \
              "secrets:${missing}"
            exit 1
          fi
          version="${TAG#v}"
          # node-publish-action enforces strict
          # MAJOR.MINOR.PATCH[-suffix]; validate early for a clearer
          # failure message
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          then
            echo "::error::Tag ${TAG} does not map to a strict" \
              "MAJOR.MINOR.PATCH[-suffix] version"
            exit 1
          fi
          nexus_user="${NEXUS_USER_INPUT}"
          if [ -z "${nexus_user}" ]; then
            # 1Password credential naming contract: the credential
            # (and username) take the name of the repository being
            # published (the checked-out repository, not necessarily
            # the caller)
            nexus_user="${TARGET_REPOSITORY##*/}"
          fi
          # Constrain to a safe single-line character set before the
          # value reaches $GITHUB_OUTPUT (output-file injection)
          if [[ ! "${nexus_user}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid nexus_user value: ${nexus_user}"
            exit 1
          fi
          echo "publish_version=${version}" >> "$GITHUB_OUTPUT"
          echo "nexus_user=${nexus_user}" >> "$GITHUB_OUTPUT"

      # credential_grants_json wires the admin-managed
      # CREDENTIAL_LOAD_GRANTS repository/organisation variable in at
      # the workflow layer: composite actions cannot read vars, and the
      # grants list must never become a caller-facing input.
      # credential-load-action v2+ performs no checkout by default,
      # so the downloaded artefact tree survives this step intact
      - name: 'Load publish credential'
        id: load-credential
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/credential-load-action@025002b47f4302fb7252175c470da69435060176  # v2.0.4
        with:
          # yamllint disable-line rule:line-length
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault_mapping_json: ${{ secrets.VAULT_MAPPING_JSON }}
          credential_name: ${{ matrix.target.credential_name }}
          credential_grants_json: ${{ vars.CREDENTIAL_LOAD_GRANTS }}
          export_env: 'false'

      # The registry check below reads with the leg's own credential:
      # Nexus repositories often refuse anonymous reads, and a refused
      # read has to fail the leg rather than pass for an absent version.
      # The file lands in RUNNER_TEMP, outside the project tree, so it
      # neither replaces the project's .npmrc (node-publish-action
      # resolves the registry from it) nor sits where npm packs; the
      # action scrubs it after the job.
      - name: 'Configure registry read access'
        id: read-npmrc
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/node-create-npmrc-action@e0ff8adfc0591c86d8d07828bffab10f43096155  # v0.2.0
        with:
          registry_url: ${{ matrix.target.registry_url }}
          nexus_user: ${{ steps.publish-params.outputs.nexus_user }}
          # yamllint disable-line rule:line-length
          nexus_password: ${{ matrix.target.auth == 'nexus' && steps.load-credential.outputs.credential || '' }}
          # yamllint disable-line rule:line-length
          auth_token: ${{ matrix.target.auth == 'token' && steps.load-credential.outputs.credential || '' }}
          path: ${{ runner.temp }}/registry-check

      # The check asks npm where the package publishes, and npm's
      # answer depends on its release, so it runs under the Node.js the
      # publish uses rather than whichever one the runner image carries.
      - name: 'Set up Node.js'
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ needs.node-metadata.outputs.node_version }}
          # setup-node v5+ caches npm unasked when package.json names
          # it as packageManager; a release lane must not (CWE-349)
          package-manager-cache: false

      # Publishing precedes promotion, so a re-run after a partial
      # publish reaches targets that already hold the release, where
      # npm would fail with EPUBLISHCONFLICT (#141). This is
      # merge.yaml's release-publish check, kept byte-identical in its
      # run block (testing.yaml's release-registry-check job compares
      # the two and exercises it): identical bytes on the registry
      # complete the leg without publishing, different bytes fail it,
      # and only a definite absence (E404) publishes.
      #
      # Identical means the integrity of the build job's tarball.
      # "Re-run failed jobs" reuses it; re-running every job repacks
      # it, and a build that is not byte-reproducible then fails on
      # targets holding the first pack.
      - name: 'Check the registry for this release'
        id: registry-check
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          TARBALL: ${{ needs.build.outputs.artefact_path }}/${{ needs.build.outputs.tarball_name }}
          PUBLISH_VERSION: ${{ steps.publish-params.outputs.publish_version }}
          REGISTRY_URL: ${{ matrix.target.registry_url }}
          TARGET_NAME: ${{ matrix.target.name }}
          PROJECT_DIR: ${{ inputs.path_prefix }}
          NPMRC_PATH: ${{ steps.read-npmrc.outputs.npmrc_path }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Check whether the registry already holds this release
          if [ ! -f "${TARBALL}" ]; then
            echo "::error::Release tarball not found: ${TARBALL}"
            exit 1
          fi
          # npm trims whitespace around the name before publishing, so
          # the check reads the name npm sends. The version is compared
          # raw, as node-publish-action compares it.
          if ! manifest="$(tar -xzOf "${TARBALL}" package/package.json)" \
            || ! name="$(jq -r '.name // empty | if type == "string"
                then gsub("^\\s+|\\s+$"; "") else . end' \
                <<< "${manifest}")" \
            || ! version="$(jq -r '.version // empty' <<< "${manifest}")"; then
            echo "::error::Cannot read package.json from ${TARBALL}"
            exit 1
          fi
          name_re='^(@[A-Za-z0-9~][A-Za-z0-9._~-]*/)?'
          name_re+='[A-Za-z0-9~][A-Za-z0-9._~-]*$'
          if [[ ! "${name}" =~ ${name_re} ]]; then
            echo "::error::Unusable package name in ${TARBALL}"
            exit 1
          fi
          if [ "${version}" != "${PUBLISH_VERSION}" ]; then
            echo "::error::${TARBALL} holds version ${version}, not" \
              "${PUBLISH_VERSION}"
            exit 1
          fi
          spec="${name}@${version}"

          # node-publish-action publishes wherever npm would, and this
          # check reads registry_url, so it can vouch only for a publish
          # landing there. This mirrors npm's pickRegistry: the
          # package's own scope, then the configured scope, then
          # --registry, with publishConfig flattened over the project's
          # npm configuration (a present but empty key masks it). Any
          # other destination publishes unchecked, as before the check
          # existed. The destination is not printed: it is project
          # configuration, and could carry a credential.
          target="${REGISTRY_URL%/}"
          # $1 key: publishConfig's value if present, else the project
          # configuration's; empty when neither sets it. npm treats a
          # null or false value as unset, so they read as empty too.
          # The project's comes from config list --json, not config
          # get: from npm 9, config get prints a scope=null publish
          # ignores as the scope 'null'. --no-workspaces as the publish
          # passes it: inside a workspace, npm otherwise reads another
          # project's configuration.
          setting() {
            local found
            found="$(jq -r --arg k "$1" '(.publishConfig // {})
              | if type == "object" and has($k)
                then "=" + (.[$k] | if . == null or . == false
                  then "" else tostring end)
                else "" end' \
              <<< "${manifest}")" || return 1
            if [ -n "${found}" ]; then
              printf '%s\n' "${found#=}"
              return 0
            fi
            jq -r --arg k "$1" '.[$k] | if . == null or . == false
              then "" else tostring end' <<< "${npm_config}"
          }
          effective_registry() {
            local registry='' scope=''
            if [[ "${name}" == @*/* ]]; then
              registry="$(setting "${name%%/*}:registry")" || return 1
            fi
            if [ -z "${registry}" ]; then
              scope="$(setting scope)" || return 1
            fi
            if [ -z "${registry}" ] && [ -n "${scope}" ]; then
              registry="$(setting "@${scope#@}:registry")" || return 1
            fi
            if [ -z "${registry}" ]; then
              # From npm 10.5.2 the --registry node-publish-action
              # passes beats publishConfig.registry; before it the
              # latter wins, and empty means npm's default. Only a
              # value naming the target is right on both sides.
              registry="$(jq -r '(.publishConfig // {})
                | if type == "object" and has("registry")
                  then (.registry | tostring) else env.REGISTRY_URL end
                | if . == "" then "npm-default" else . end' \
                <<< "${manifest}")" || return 1
            fi
            printf '%s\n' "${registry}"
          }
          if ! npm_config="$(cd "${PROJECT_DIR}" \
              && npm config list --json --no-workspaces)" \
            || ! effective="$(effective_registry)"; then
            echo "::error::Cannot read the registry settings for ${spec}"
            exit 1
          fi
          if [ "${effective%/}" != "${target}" ]; then
            echo "::warning::${spec}'s npm configuration publishes it" \
              "somewhere other than ${TARGET_NAME}'s registry_url;" \
              "publishing without checking for an existing copy"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A neutral directory and an explicit userconfig, so no
          # project or runner .npmrc redirects the read. The package's
          # own scope is pinned too: npm prefers a scoped registry
          # setting over --registry.
          userconfig="${NPMRC_PATH:-/dev/null}"
          workdir="$(mktemp -d)"
          trap 'rm -rf -- "${workdir}"' EXIT
          set -- "${spec}" dist --json --prefer-online \
            --registry "${REGISTRY_URL}" --userconfig "${userconfig}"
          if [[ "${name}" == @*/* ]]; then
            set -- "$@" "--${name%%/*}:registry=${REGISTRY_URL}"
          fi
          set +e
          (cd "${workdir}" && npm view "$@") \
            > "${workdir}/view.out" 2> "${workdir}/view.err"
          rc=$?
          set -e

          if [ "${rc}" = '0' ]; then
            # npm before 7 reports a missing version as empty output
            if grep -q '[^[:space:]]' "${workdir}/view.out"; then
              state='present'
            else
              state='absent'
            fi
          else
            code="$(jq -r '(.error.code)? // empty' "${workdir}/view.out" \
              2> /dev/null || true)"
            if [ -z "${code}" ]; then
              code="$(grep -oE '^npm (ERR!|error) code [A-Z0-9_]+' \
                "${workdir}/view.err" | head -n 1 || true)"
              code="${code##* }"
            fi
            if [ "${code}" = 'E404' ]; then
              state='absent'
            else
              head -n 20 "${workdir}/view.err" >&2
              if [ "${DRY_RUN}" = 'true' ]; then
                echo "::warning::Could not read ${spec} from" \
                  "${TARGET_NAME} (${code:-exit ${rc}}); a dry run" \
                  "publishes nothing, so rehearsing anyway"
                echo "publish=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::Could not read ${spec} from" \
                "${TARGET_NAME} (${code:-exit ${rc}}); refusing to" \
                "publish without knowing whether it is already there"
              exit 1
            fi
          fi

          if [ "${state}" = 'absent' ]; then
            echo "${spec} is not on ${TARGET_NAME}; publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! remote_integrity="$(jq -r '.integrity // empty' \
              "${workdir}/view.out")" \
            || ! remote_shasum="$(jq -r '.shasum // empty' \
              "${workdir}/view.out")"; then
            echo "::error::Unreadable registry metadata for ${spec}"
            exit 1
          fi
          local_sha512="sha512-$(openssl dgst -sha512 -binary "${TARBALL}" \
            | openssl base64 -A)"
          local_sha1="$(openssl dgst -sha1 -r "${TARBALL}")"
          local_sha1="${local_sha1%% *}"

          # SRI integrity may list several digests; sha512 decides
          # when present, and the legacy sha1 shasum otherwise. The
          # pair that decided is the pair a mismatch reports.
          verdict=''
          remote_digest=''
          local_digest="${local_sha512}"
          read -ra digests <<< "${remote_integrity}"
          for digest in "${digests[@]}"; do
            case "${digest}" in
              sha512-*)
                [ -n "${verdict}" ] || verdict='different'
                remote_digest="${digest%%\?*}"
                if [ "${digest%%\?*}" = "${local_sha512}" ]; then
                  verdict='identical'
                fi
                ;;
            esac
          done
          if [ -z "${verdict}" ] && [ -n "${remote_shasum}" ]; then
            verdict='different'
            remote_digest="sha1 ${remote_shasum,,}"
            local_digest="sha1 ${local_sha1}"
            if [ "${remote_shasum,,}" = "${local_sha1}" ]; then
              verdict='identical'
            fi
          fi

          case "${verdict}" in
            identical)
              msg="${spec} is already on ${TARGET_NAME} with identical"
              msg="${msg} content; not publishing it again"
              echo "::notice::${msg}"
              echo "${msg} ✅" >> "$GITHUB_STEP_SUMMARY"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            different)
              echo "::error::${TARGET_NAME} already holds ${spec} with" \
                "different content, and npm cannot overwrite a version." \
                "Registry: ${remote_digest}; this run: ${local_digest}"
              exit 1
              ;;
            *)
              echo "::error::${TARGET_NAME} holds ${spec} but reports no" \
                "sha512 integrity or shasum to compare against"
              exit 1
              ;;
          esac

      - name: 'Publish release'
        # A target already holding this release is skipped
        if: steps.registry-check.outputs.publish == 'true'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/node-publish-action@f16a8028741af0092c72f4a24f6626d9c2afb54b  # v0.2.1
        with:
          # yamllint disable-line rule:line-length
          publish_version: ${{ steps.publish-params.outputs.publish_version }}
          registry_url: ${{ matrix.target.registry_url }}
          path_prefix: ${{ inputs.path_prefix }}
          # The build job packs the tarball and uploads it as the build
          # artefact, which the attest and sign-artefacts jobs consume.
          # Publishing that same archive keeps the attested bytes and
          # the published bytes one object; packing again here would
          # reintroduce the prepublishOnly divergence issue #85
          # describes. The download above already placed it.
          # yamllint disable-line rule:line-length
          tarball_path: ${{ needs.build.outputs.artefact_path }}/${{ needs.build.outputs.tarball_name }}
          node_version: ${{ needs.node-metadata.outputs.node_version }}
          tag: ${{ inputs.npm_tag }}
          access: ${{ inputs.npm_access }}
          dry_run: ${{ inputs.dry_run }}
          # Nexus npm repositories lack provenance/attestation support
          provenance: 'false'
          load_credential: 'false'
          nexus_user: ${{ steps.publish-params.outputs.nexus_user }}
          # One credential is loaded per leg; which input carries it
          # depends on the target's auth mode. The unused one stays
          # empty so the action sees a single mode selected.
          # yamllint disable-line rule:line-length
          nexus_password: ${{ matrix.target.auth == 'nexus' && steps.load-credential.outputs.credential || '' }}
          # yamllint disable-line rule:line-length
          auth_token: ${{ matrix.target.auth == 'token' && steps.load-credential.outputs.credential || '' }}
