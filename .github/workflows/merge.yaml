---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Node.js merge/publish pipeline (Model B: merge-driven).
#
# Implements the Jenkins-heritage LF/Gerrit release model: every merge
# publishes a snapshot (version derived from committed metadata in
# version.properties -> X.Y.Z-SNAPSHOT), and a release publish triggers
# when the merged commit adds a release file under releases/:
#   { resolve-version | node-metadata -> build } -> snapshot-publish
#   resolve-version -> check-release -> release-publish (only when a
#   release file merged, and its version matches version.properties)
#
# The project builds once: the build job uploads the complete built
# tree (including gitignored build output such as lib/ or dist/) as a
# workflow artefact, and the publish jobs download that artefact
# instead of checking out and rebuilding. What publishes is exactly
# what built and passed verification.
#
# Call this from a thin caller workflow dispatched on Gerrit
# change-merged events (or push-to-main for GitHub-native projects); see
# examples/merge/ for both caller forms.
name: '[R] Node.js Merge/Publish'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: >-
          Branch/tag/SHA to check out. Empty uses the triggering
          event's ref for same-repository checkouts, or the default
          branch when checking out a different repository.
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Node.js toolchain ---
      node_version:
        description: >-
          Node.js version to use. Empty (the default) auto-detects a
          plain engines.node version from package.json and otherwise
          falls back to the current default (22).
        required: false
        type: string
        default: ''
      build_node_version:
        description: >-
          Node.js version for jobs that run the project's own
          toolchain. Empty (the default) follows node_version. Set
          this when a legacy dependency tree caps the build below the
          version the pack/publish jobs need.
        required: false
        type: string
        default: ''
      build_tool:
        description: >-
          Build tool: 'npm' or 'yarn'. Empty (the default) auto-detects
          the package manager from the project lockfile/metadata and
          otherwise falls back to npm.
        required: false
        type: string
        default: ''

      # --- Build ---
      build_scripts:
        description: 'package.json script(s) the build job runs'
        required: false
        type: string
        default: 'build'

      # --- Supply chain ---
      # Both apply to release publishes only. Snapshot publishes are
      # transient and replaced on every merge, so attesting or signing
      # them would produce records nothing can meaningfully verify
      # against later.
      attestations:
        description: >-
          Generate SLSA build provenance for the packed release tarball
          (verifiable with `gh attestation verify`). Keep it toggleable
          for air-gapped or Gerrit-mirrored consumers that cannot reach
          Sigstore.
        required: false
        type: boolean
        default: true
      sigstore_sign:
        description: >-
          Sign the packed release tarball with Sigstore (keyless/OIDC),
          producing a .sigstore.json bundle uploaded as a workflow
          artefact (verifiable with `cosign verify-blob --bundle`). Keep
          it toggleable for air-gapped or Gerrit-mirrored consumers that
          cannot reach Sigstore.
        required: false
        type: boolean
        default: true

      # --- Nexus/registry publishing ---
      #
      # Two forms. The *_targets inputs take a JSON array and can
      # reach several registries; the *_registry_url inputs take one
      # URL and are kept working for existing callers. Supplying a
      # targets list makes the matching URL input inert.
      snapshot_targets:
        description: >-
          JSON array of snapshot publish targets. Each entry needs
          'name', 'registry_url' and 'auth' ('nexus' or 'token'), and
          may carry 'credential_name' to name the 1Password item.
          Leave unset to fall back to snapshot_registry_url; an empty
          array [] is rejected, not a fallback.
        required: false
        type: string
        default: ''
      release_targets:
        description: >-
          JSON array of release publish targets, in the same shape as
          snapshot_targets. Leave unset to fall back to
          release_registry_url; an empty array [] is rejected, not a
          fallback.
        required: false
        type: string
        default: ''
      snapshot_registry_url:
        description: >-
          Single npm registry URL that receives snapshot publishes,
          e.g. https://nexus3.example.org/repository/npm.snapshot/
          Deprecated: prefer snapshot_targets.
        required: false
        type: string
        default: ''
      release_registry_url:
        description: >-
          Single npm registry URL that receives release publishes,
          e.g. https://nexus3.example.org/repository/npm.release/
          Deprecated: prefer release_targets.
        required: false
        type: string
        default: ''
      nexus_user:
        description: >-
          Nexus username override; empty derives the username from the
          repository name (the 1Password credential naming contract)
        required: false
        type: string
        default: ''
      snapshot_dist_tag:
        description: >-
          npm dist-tag for snapshot publishes. Not 'latest': npm
          install resolves 'latest', which has to keep naming the
          newest release rather than whichever snapshot merged last.
        required: false
        type: string
        default: 'snapshot'
      dry_run:
        description: >-
          Rehearse the publish steps without uploading. Needs no
          credentials, and skips attestation and signing, which would
          otherwise leave permanent public records for a version that
          never shipped.
        required: false
        type: boolean
        default: false

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      build_permit_egress_traffic:
        description: >
          Run harden-runner in audit mode for the build job only,
          permitting unrestricted egress. Use when the build fetches
          dependencies from CDNs that are impractical to enumerate in the
          allow-list. Other jobs stay governed by harden_runner_egress;
          left unset, the build job follows it too.
        required: false
        type: boolean
        default: false
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@e0e35011ee145321a51d3226f044ec88dfe645b1'  # v0.16.4

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: >-
          Gerrit refspec of the merged change: normally the branch ref
          a change-merged event carries, or a change ref to re-run an
          already-merged change. Resolved once, so every job builds
          the same commit; it must be on gerrit_branch.
        required: false
        type: string
        default: ''
      gerrit_patchset_revision:
        description: >-
          The triggering change's revision (GERRIT_PATCHSET_REVISION).
          Pins the run to the commit that merged it; without it a
          branch refspec builds whatever the branch tip is when the
          run resolves it.
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: >-
          1Password service-account token used by credential-load-action
          to fetch the per-repository Nexus credential from the common
          per-org CI/CD vault (op://<vault>/<repository-name>/password).
          A live run fails when this is unset. A dry run never loads a
          credential, set or not, and still rehearses each publish.
        required: false
      VAULT_MAPPING_JSON:
        description: >-
          Base64-encoded JSON mapping of organisation name to 1Password
          vault ID, keyed on github.repository_owner; consumed by
          credential-load-action to resolve the correct vault. A live
          run fails when this is unset. A dry run never loads a
          credential, set or not, and still rehearses each publish.
        required: false

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Gerrit Inputs'
    # Fails fast with a clear message when gerrit_refspec is set without
    # the project/branch the Gerrit checkout path also requires. The
    # build-chain root job depends on this, so invalid Gerrit inputs stop
    # the pipeline early and cleanly. This job always runs (only the
    # validation step is conditional), so gating dependents on it does
    # not trip GitHub's "skipped need skips dependents" behaviour.
    # The job carries no harden-runner step by design: it performs pure
    # input-string validation with no checkout, artifacts or network
    # access, and loading the egress allow-list would itself add an
    # outbound call.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Validate path_prefix input'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # Require a relative, non-traversing path: later jobs cd
          # into it and derive packaging/publish paths from it, so
          # absolute paths or .. segments could escape the checkout
          if [ "${PATH_PREFIX}" = '.' ]; then
            exit 0
          fi
          if [[ ! "${PATH_PREFIX}" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] \
            || [[ "${PATH_PREFIX}" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid path_prefix input: ${PATH_PREFIX}"
            exit 1
          fi

      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

  # Resolve, once, the commit this run builds and publishes (#119).
  #
  # A merge event's refspec is usually the branch ref, and checking
  # that out in each job separately means each job gets whatever the
  # branch tip is when it starts -- on the GitHub mirror, which can
  # also lag Gerrit. A merge landing mid-run then splits one run across
  # commits, or misses the triggering change entirely. Every later
  # Gerrit checkout fetches the SHA resolved here instead.
  #
  # Resolution asks Gerrit, never the mirror, and starts from the
  # triggering revision (gerrit_patchset_revision) when the caller
  # forwards it. Under a merge-if-necessary submit type that revision
  # need not be the commit on the branch: Gerrit may have merged it
  # with a merge commit. So the build commit is the first-parent
  # commit that brought the revision onto the branch -- the revision
  # itself when it was fast-forwarded.
  #
  # The revision must be on the target branch. Re-dispatching a
  # merged release change by its change ref is a legitimate recovery;
  # an unmerged patchset would publish code nobody merged, so it is
  # refused.
  resolve-commit:
    name: 'Resolve Commit'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    # Reads Gerrit over HTTPS and checks nothing out
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # The GitHub-native path checks out inputs.ref, which the caller
      # already pins; there is nothing to resolve, and every job keeps
      # checking out that ref as before.
      - name: 'Resolve the commit to build'
        id: resolve
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_REFSPEC: ${{ inputs.gerrit_refspec }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          REVISION: ${{ inputs.gerrit_patchset_revision }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
        run: |
          # Resolve the triggering revision against Gerrit's branch
          if [ -n "${REVISION}" ] \
            && [[ ! "${REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::gerrit_patchset_revision must be a full" \
              "40-character commit SHA"
            exit 1
          fi
          repo="${RUNNER_TEMP}/resolve-commit"
          rm -rf "${repo}"
          git init -q "${repo}"
          cd "${repo}"
          remote="${GERRIT_URL}/${GERRIT_PROJECT}"
          branch_ref='refs/remotes/gerrit/branch'
          # The whole branch history: mapping a revision to the commit
          # that merged it, and proving ancestry, both walk it
          if ! git fetch -q --no-tags -- "${remote}" \
            "+refs/heads/${GERRIT_BRANCH}:${branch_ref}" 2> /dev/null; then
            echo "::error::Cannot fetch ${GERRIT_BRANCH} from Gerrit"
            exit 1
          fi
          if [ -n "${REVISION}" ]; then
            revision="${REVISION}"
            if ! git cat-file -e "${revision}^{commit}" 2> /dev/null \
              && ! git fetch -q --no-tags -- "${remote}" \
                "${revision}" 2> /dev/null; then
              echo "::error::Gerrit does not serve revision" \
                "${revision}"
              exit 1
            fi
          elif [ "${GERRIT_REFSPEC}" = "refs/heads/${GERRIT_BRANCH}" ]; then
            # No triggering revision to anchor on: the branch tip is
            # the closest available, but a merge landing between the
            # event and this job moves it. Forward
            # GERRIT_PATCHSET_REVISION to pin the exact change.
            echo "::notice::No gerrit_patchset_revision; building the" \
              "current tip of ${GERRIT_BRANCH}"
            revision=$(git rev-parse "${branch_ref}")
          else
            if ! git fetch -q --no-tags -- "${remote}" \
              "${GERRIT_REFSPEC}" 2> /dev/null; then
              echo "::error::Cannot fetch ${GERRIT_REFSPEC} from Gerrit"
              exit 1
            fi
            revision=$(git rev-parse 'FETCH_HEAD^{commit}')
          fi
          if ! git merge-base --is-ancestor "${revision}" "${branch_ref}"
          then
            echo "::error::Revision ${revision} is not on" \
              "${GERRIT_BRANCH}; refusing to build or publish an" \
              "unmerged change"
            exit 1
          fi
          # The commit Gerrit put on the branch for this revision: the
          # revision itself when fast-forwarded, otherwise the oldest
          # first-parent commit descending from it, i.e. its merge.
          # Listed into a variable rather than piped to grep -q, which
          # can exit early and SIGPIPE rev-list under pipefail.
          mainline=$(git rev-list --first-parent "${branch_ref}")
          if grep -qx "${revision}" <<< "${mainline}"; then
            commit="${revision}"
          else
            commit=$(git rev-list --first-parent \
              --ancestry-path="${revision}" \
              "${revision}..${branch_ref}" | tail -n 1)
          fi
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot find the commit that merged" \
              "${revision} onto ${GERRIT_BRANCH}"
            exit 1
          fi
          echo "Building ${commit} (merged ${revision} on" \
            "${GERRIT_BRANCH})"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

  repository-metadata:
    name: 'Repository Metadata'
    needs: resolve-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ needs.resolve-commit.outputs.commit }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@847400e0d0b34cc88a572fa9575accd80401b796  # v0.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  node-metadata:
    name: 'Node.js Metadata'
    needs: resolve-commit
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.resolve.outputs.node_version }}
      build_tool: ${{ steps.resolve.outputs.build_tool }}
      # yamllint disable-line rule:line-length
      build_node_version: ${{ steps.resolve.outputs.build_node_version }}
      # yamllint disable-line rule:line-length
      has_lock_file: ${{ steps.build-metadata.outputs.javascript_has_lock_file }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ needs.resolve-commit.outputs.commit }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Gather Node.js build metadata'
        id: build-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/build-metadata-action@ef53139abdf48a63b097efc740202c140571b0d4  # v0.8.3
        with:
          path_prefix: ${{ inputs.path_prefix }}
          artifact_upload: 'false'

      - name: 'Resolve Node.js version and build tool'
        id: resolve
        shell: bash
        env:
          NODE_VERSION_INPUT: ${{ inputs.node_version }}
          BUILD_NODE_VERSION_INPUT: ${{ inputs.build_node_version }}
          BUILD_TOOL_INPUT: ${{ inputs.build_tool }}
          # yamllint disable-line rule:line-length
          DETECTED_PACKAGE_MANAGER: ${{ steps.build-metadata.outputs.javascript_package_manager }}
          # yamllint disable-line rule:line-length
          DETECTED_REQUIRES_NODE: ${{ steps.build-metadata.outputs.javascript_requires_node }}
        run: |
          # Resolve the effective Node.js version and build tool:
          # explicit inputs win, then metadata detection, then defaults
          node_version="${NODE_VERSION_INPUT}"
          # Constrain caller input to the character set the downstream
          # setup/audit/publish actions accept, and keep the value safe
          # to write to $GITHUB_OUTPUT
          if [ -n "${node_version}" ] &&
            [[ ! "${node_version}" =~ ^[A-Za-z0-9./*_-]+$ ]]; then
            echo "::error::Invalid node_version input:" \
              "$(printf '%s' "${node_version}" | tr -d '\r\n')"
            exit 1
          fi
          if [ -z "${node_version}" ]; then
            # Use the engines.node constraint when it names a plain
            # version; downstream actions reject range syntax (>=18)
            if [[ "${DETECTED_REQUIRES_NODE}" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]
            then
              node_version="${DETECTED_REQUIRES_NODE}"
            elif [ -n "${DETECTED_REQUIRES_NODE}" ]; then
              echo "::notice::engines.node constraint" \
                "'${DETECTED_REQUIRES_NODE}' is not a plain version;" \
                "using the default Node.js version"
            fi
          fi
          if [ -z "${node_version}" ]; then
            node_version='22'
          fi
          build_tool="${BUILD_TOOL_INPUT}"
          case "${build_tool}" in
            npm|yarn) ;;
            '')
              case "${DETECTED_PACKAGE_MANAGER}" in
                npm|yarn)
                  build_tool="${DETECTED_PACKAGE_MANAGER}"
                  ;;
                '')
                  build_tool='npm'
                  ;;
                *)
                  echo "::notice::Detected package manager" \
                    "'${DETECTED_PACKAGE_MANAGER}' lacks" \
                    "node-build-action support; using npm"
                  build_tool='npm'
                  ;;
              esac
              ;;
            *)
              echo "::error::Invalid build_tool input: ${build_tool}" \
                "(must be 'npm' or 'yarn')"
              exit 1
              ;;
          esac
          # Jobs that run the project's own toolchain can need a
          # different Node.js from the pack/publish jobs, which only
          # need a modern npm and never rebuild. A legacy dependency
          # tree can cap the first well below what the second
          # requires, leaving no single version that satisfies both.
          # Empty follows node_version, so this costs nothing unless
          # a caller needs the split.
          build_node_version="${BUILD_NODE_VERSION_INPUT}"
          if [ -n "${build_node_version}" ] &&
            [[ ! "${build_node_version}" =~ ^[A-Za-z0-9./*_-]+$ ]]; then
            echo "::error::Invalid build_node_version input:" \
              "$(printf '%s' "${build_node_version}" \
                | tr -d '\r\n')"
            exit 1
          fi
          if [ -z "${build_node_version}" ]; then
            build_node_version="${node_version}"
          fi
          echo "Resolved Node.js version: ${node_version}"
          echo "Resolved build tool: ${build_tool}"
          echo "Build toolchain Node.js version: ${build_node_version}"
          {
            echo "node_version=${node_version}"
            echo "build_tool=${build_tool}"
            echo "build_node_version=${build_node_version}"
          } >> "$GITHUB_OUTPUT"

  resolve-version:
    name: 'Resolve Version'
    needs: resolve-commit
    runs-on: ubuntu-latest
    outputs:
      # yamllint disable-line rule:line-length
      version: ${{ steps.build-metadata.outputs.version_properties_version }}
      snapshot_version: ${{ steps.build-metadata.outputs.snapshot_version }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ needs.resolve-commit.outputs.commit }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # version.properties (the Jenkins/global-jjb heritage version
      # source) remains mandatory for the merge workflow. The
      # build-metadata-action parses it (never sourcing it, and
      # skipping Jenkins-era ${...} interpolated values) and
      # synthesizes the X.Y.Z-SNAPSHOT interim version, so no
      # version extraction logic lives in workflow shell code.
      - name: 'Gather version metadata'
        id: build-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/build-metadata-action@ef53139abdf48a63b097efc740202c140571b0d4  # v0.8.3
        with:
          path_prefix: ${{ inputs.path_prefix }}
          artifact_upload: 'false'

      - name: 'Require version.properties version'
        env:
          # yamllint disable-line rule:line-length
          PROPS_VERSION: ${{ steps.build-metadata.outputs.version_properties_version }}
        shell: bash
        run: |
          # Fail fast unless version.properties supplied a full X.Y.Z
          # numeric version: the merge workflow requires one, and the
          # guard keeps malformed content out of downstream jobs
          if [ -z "${PROPS_VERSION}" ]; then
            echo "::error::No version resolved from" \
              "version.properties; the merge workflow requires one"
            exit 1
          fi
          if [[ ! "${PROPS_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version resolved: ${PROPS_VERSION}"
            exit 1
          fi
          echo "Resolved version: ${PROPS_VERSION}"

      # Snapshots must never take 'latest', which npm install resolves
      # and which must keep naming the newest release (#122). Checked
      # here so a bad value fails before anything builds.
      #
      # npm refuses a dist-tag that parses as a semver range, which
      # covers more than leading digits: 'x', 'X', 'x.x' and 'vx' are
      # all wildcard ranges. Rather than approximate that rule, ask
      # the semver module npm itself bundles, so this gate refuses
      # exactly what 'npm publish --tag' would. The character set
      # matches the one node-publish-action enforces.
      - name: 'Validate snapshot dist-tag'
        shell: bash
        env:
          SNAPSHOT_DIST_TAG: ${{ inputs.snapshot_dist_tag }}
        run: |
          # Validate the snapshot dist-tag
          case "${SNAPSHOT_DIST_TAG}" in
            latest)
              echo "::error::snapshot_dist_tag cannot be 'latest';" \
                "that tag must name the newest release"
              exit 1
              ;;
            '' | *[!A-Za-z0-9._-]*)
              echo "::error::Invalid snapshot_dist_tag:" \
                "$(printf '%s' "${SNAPSHOT_DIST_TAG}" | tr -d '\r\n')"
              exit 1
              ;;
          esac
          # Exit 10: a range, refused. Exit 11: not a range. Any other
          # status -- including the 1 Node exits with when the require
          # throws -- means npm's semver could not be loaded, and the
          # gate must not pass a tag it never checked.
          set +e
          node -e '
            const path = require("path");
            const semver = require(path.join(process.argv[1], "npm",
              "node_modules", "semver", "ranges", "valid.js"));
            process.exit(semver(process.argv[2]) === null ? 11 : 10);
          ' "$(npm root -g)" "${SNAPSHOT_DIST_TAG}"
          rc=$?
          set -e
          case "${rc}" in
            10)
              echo "::error::snapshot_dist_tag '${SNAPSHOT_DIST_TAG}'" \
                "parses as a semver range, which npm refuses as a" \
                "dist-tag"
              exit 1
              ;;
            11) ;;
            *)
              echo "::error::Cannot load npm's semver module to" \
                "check snapshot_dist_tag"
              exit 1
              ;;
          esac
          echo "Snapshot dist-tag: ${SNAPSHOT_DIST_TAG}"

  build:
    name: 'Build'
    needs:
      - 'node-metadata'
      - 'resolve-commit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # The build job can opt into audit egress independently of the
      # other jobs via build_permit_egress_traffic, for dependency
      # fetches from CDNs impractical to enumerate in the allow-list.
      # Left unset it follows harden_runner_egress like every other job.
      #
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever a
      # step-level 'if:' says. Both would engage the agent, the first
      # would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.build_permit_egress_traffic || inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ needs.resolve-commit.outputs.commit }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Build project'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/node-build-action@02ffec745cddf67291d0b28f64bd81990cae327f  # v0.2.4
        with:
          node_version: ${{ needs.node-metadata.outputs.build_node_version }}
          build_tool: ${{ needs.node-metadata.outputs.build_tool }}
          path_prefix: ${{ inputs.path_prefix }}
          scripts: ${{ inputs.build_scripts }}

      # The publish jobs consume this artefact instead of rebuilding
      # or re-checking-out: the project builds once, and the exact
      # built tree (including gitignored build output such as lib/ or
      # dist/, which a fresh checkout would lack) is what publishes.
      # node_modules stays behind: npm pack excludes it and the
      # publish jobs run no install. Hidden files (.npmignore,
      # .npmrc templates) ship so npm packs the intended content.
      - name: 'Upload built project'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: node-build-content
          path: |
            ${{ inputs.path_prefix }}/**
            !${{ inputs.path_prefix }}/**/node_modules/**
            !${{ inputs.path_prefix }}/**/.git/**
          include-hidden-files: true
          retention-days: 7
          # The publish jobs hard-depend on this artefact; a missing
          # or empty build tree must fail here, not mid-publish
          if-no-files-found: error

  # Resolve the publish target lists before either publish job, so a
  # malformed targets input fails once, early, and names the offending
  # entry -- rather than failing identically in every matrix leg after
  # the build has already run.
  resolve-snapshot-targets:
    name: 'Resolve Snapshot Targets'
    needs: gerrit-validate
    permissions:
      contents: read
    uses: $/.github/workflows/publish-targets.yaml
    with:
      label: 'snapshot'
      targets_json: ${{ inputs.snapshot_targets }}
      registry_url: ${{ inputs.snapshot_registry_url }}

  resolve-release-targets:
    name: 'Resolve Release Targets'
    needs: gerrit-validate
    permissions:
      contents: read
    uses: $/.github/workflows/publish-targets.yaml
    with:
      label: 'release'
      targets_json: ${{ inputs.release_targets }}
      registry_url: ${{ inputs.release_registry_url }}

  snapshot-publish:
    # The leg name comes from the target, so a failed check names the
    # registry that failed rather than leaving the reader to open it.
    name: 'Publish Snapshot (${{ matrix.target.name }})'
    runs-on: ubuntu-latest
    needs:
      - 'resolve-version'
      - 'node-metadata'
      - 'build'
      - 'resolve-snapshot-targets'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.resolve-version.result == 'success' && needs.build.result == 'success' && needs.resolve-snapshot-targets.result == 'success' }}
    strategy:
      # One registry rejecting a publish must not abandon the others:
      # the legs are independent destinations for the same artefact,
      # and a partial publish is easier to complete than to redo.
      fail-fast: false
      matrix:
        # yamllint disable-line rule:line-length
        target: ${{ fromJSON(needs.resolve-snapshot-targets.outputs.matrix) }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Publishes use the build job's artefact — the exact tree the
      # build produced — rather than a fresh (unbuilt) checkout, so
      # the job builds nothing and gitignored build output (lib/,
      # dist/) reaches npm publish intact.
      - name: 'Download built project'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: node-build-content
          path: ${{ inputs.path_prefix }}

      # A live run without credentials fails: this workflow runs on
      # merges, where a missing secret is a misconfiguration, and
      # skipping would leave a green run that published nothing
      # (#120). A dry run needs no credential and never loads one,
      # even when the secrets are set, so a stale grant or a 1Password
      # outage cannot fail a rehearsal (#121).
      - name: 'Check publish credentials'
        id: creds
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          HAS_CREDENTIALS: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' && secrets.VAULT_MAPPING_JSON != '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Gate publishing on credential availability. Dry run
          # first: node-publish-action configures no credential in
          # dry-run mode, so loading one could only add a failure.
          if [ "${DRY_RUN}" = 'true' ]; then
            echo "Dry run: publishing without loading a credential"
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ "${HAS_CREDENTIALS}" = 'true' ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN and/or" \
              "VAULT_MAPPING_JSON unavailable; a live run cannot" \
              "publish without them"
            exit 1
          fi

      - name: 'Resolve Nexus username'
        id: publish-params
        if: steps.creds.outputs.available == 'true'
        shell: bash
        env:
          NEXUS_USER_INPUT: ${{ inputs.nexus_user }}
          # The repository actually checked out/published, which can
          # differ from GITHUB_REPOSITORY for cross-repository calls
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          # 1Password credential naming contract: the credential (and
          # username) take the name of the repository being published
          # (the checked-out repository, not necessarily the caller)
          nexus_user="${NEXUS_USER_INPUT}"
          if [ -z "${nexus_user}" ]; then
            nexus_user="${TARGET_REPOSITORY##*/}"
          fi
          # Constrain to a safe single-line character set before the
          # value reaches $GITHUB_OUTPUT (output-file injection)
          if [[ ! "${nexus_user}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid nexus_user value: ${nexus_user}"
            exit 1
          fi
          echo "nexus_user=${nexus_user}" >> "$GITHUB_OUTPUT"

      # credential_grants_json wires the admin-managed
      # CREDENTIAL_LOAD_GRANTS repository/organisation variable in at
      # the workflow layer: composite actions cannot read vars, and the
      # grants list must never become a caller-facing input.
      # credential-load-action v2+ performs no checkout by default,
      # so the downloaded artefact tree survives this step intact.
      #
      # credential_name lets each target name its own 1Password item,
      # which is what makes several registries workable: a Nexus leg
      # keeps the derived repository name, while a token leg names the
      # item holding that registry's token. Empty keeps the derived
      # name. The grants list still gates which items this repository
      # may load, so naming one here cannot widen access.
      - name: 'Load publish credential'
        id: load-credential
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/credential-load-action@025002b47f4302fb7252175c470da69435060176  # v2.0.4
        with:
          # yamllint disable-line rule:line-length
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault_mapping_json: ${{ secrets.VAULT_MAPPING_JSON }}
          credential_name: ${{ matrix.target.credential_name }}
          credential_grants_json: ${{ vars.CREDENTIAL_LOAD_GRANTS }}
          export_env: 'false'

      # Snapshot publishes skip release-grade signing/provenance by
      # design: they are replaced on every merge, and Nexus npm
      # repositories carry no registry-native provenance anyway. The
      # pack-release/attest/sign-artefacts jobs cover releases only.
      - name: 'Publish snapshot'
        # A dry run publishes nothing and needs no credential, so it
        # runs node-publish-action's dry run even without secrets
        # (#121).
        # yamllint disable-line rule:line-length
        if: steps.creds.outputs.available == 'true' || inputs.dry_run
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/node-publish-action@f16a8028741af0092c72f4a24f6626d9c2afb54b  # v0.2.1
        with:
          # yamllint disable-line rule:line-length
          publish_version: ${{ needs.resolve-version.outputs.snapshot_version }}
          registry_url: ${{ matrix.target.registry_url }}
          path_prefix: ${{ inputs.path_prefix }}
          node_version: ${{ needs.node-metadata.outputs.node_version }}
          # Never 'latest', the action's default: that tag has to keep
          # naming the newest release (#122)
          tag: ${{ inputs.snapshot_dist_tag }}
          dry_run: ${{ inputs.dry_run }}
          provenance: 'false'
          load_credential: 'false'
          nexus_user: ${{ steps.publish-params.outputs.nexus_user }}
          # One credential is loaded per leg; the target's auth mode
          # decides which input it reaches. node-publish-action treats
          # the modes as mutually exclusive and rejects two at once,
          # so exactly one of these has to be non-empty.
          # yamllint disable-line rule:line-length
          nexus_password: ${{ matrix.target.auth == 'nexus' && steps.load-credential.outputs.credential || '' }}
          # yamllint disable-line rule:line-length
          auth_token: ${{ matrix.target.auth == 'token' && steps.load-credential.outputs.credential || '' }}

  check-release:
    name: 'Check for Release File'
    # resolve-version supplies the version.properties version the
    # release file must match. Comparing here, rather than only in
    # release-publish, is what makes a mismatch fail the run: a gate
    # placed on a later job's 'if:' skips that job, and everything
    # after it, without a word (#118).
    needs:
      - 'resolve-commit'
      - 'resolve-version'
    runs-on: ubuntu-latest
    outputs:
      has_release: ${{ steps.detect.outputs.has_release }}
      version: ${{ steps.detect.outputs.version }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Both checkout paths land on the merged commit: the Gerrit path
      # fetches the one resolve-commit chose for the whole run. Both
      # fetch depth 2 so diff-tree can compare HEAD against its
      # parent. The Gerrit path states the depth rather than
      # inheriting the action's default: v1.1.0 defaulted to 1, which
      # grafted HEAD as a root commit and hid every release file
      # (#117).
      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ needs.resolve-commit.outputs.commit }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
          fetch-depth: '2'
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 2
          persist-credentials: false

      # Generic release-trigger detection (NOT a placeholder): the
      # merged commit adds a file under releases/ carrying a
      # "version: X.Y.Z" line; that version drives release-publish.
      - name: 'Detect release file in merged commit'
        id: detect
        shell: bash
        run: |
          # Detect a release file added by the merged commit. Only
          # additions count: editing or deleting an existing release
          # file is maintenance, not a request to publish its version
          # again.
          # -m --first-parent makes merge commits diff against their
          # first parent (plain diff-tree emits nothing for merges,
          # which would silently suppress release detection). A
          # diff-tree failure (e.g. insufficient history) fails loudly
          # rather than silently skipping an intended release.
          #
          # diff-tree does not fail when HEAD's parent was not
          # fetched: a shallow clone grafts HEAD as a root commit, for
          # which it prints nothing and exits 0. That reads exactly
          # like a merge with no release file, so check for the parent
          # first (#117).
          if [ "$(git rev-parse --is-shallow-repository)" = 'true' ] \
            && ! git rev-parse -q --verify 'HEAD^' > /dev/null; then
            echo "::error::The merged commit's parent is not in the" \
              "shallow checkout; cannot detect release files"
            exit 1
          fi
          # Past that guard, a HEAD with no parent is the repository's
          # genuine first commit. Plain diff-tree prints nothing for a
          # root commit, which would silently miss an initial release,
          # so --root diffs it against the empty tree instead.
          root=()
          if ! git rev-parse -q --verify 'HEAD^' > /dev/null; then
            root=(--root)
          fi
          if ! files=$(git diff-tree -m --first-parent --diff-filter=A \
            "${root[@]}" --no-commit-id -r HEAD --name-only -- "releases/")
          then
            echo "::error::git diff-tree failed; cannot detect" \
              "release files (insufficient checkout history?)"
            exit 1
          fi
          file_count=$(echo "${files}" | grep -c . || true)
          if [ "${file_count}" -eq 0 ]; then
            echo "No release file in merged commit"
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Enforce exactly one release descriptor per merged commit;
          # multiple files would make version selection arbitrary
          if [ "${file_count}" -gt 1 ]; then
            echo "::error::Multiple release files in merged commit:"
            echo "${files}"
            exit 1
          fi
          release_file="${files}"
          echo "Release file detected: ${release_file}"
          # Tolerate a missing version: line (grep exits 1 under
          # pipefail); the guard below then reports it cleanly
          version=$({ grep -E '^[[:space:]]*version:' \
            "${release_file}" || true; } \
            | head -n1 | awk '{print $2}' | tr -d '\r' | tr -d "'\"")
          # Guard against malformed/hostile content before the value
          # reaches $GITHUB_OUTPUT and downstream jobs.
          case "${version}" in
            '' | *[!0-9A-Za-z._-]*)
              echo "::error::Invalid or missing version in release" \
                "file: ${release_file}"
              exit 1
              ;;
          esac
          echo "Release version: ${version}"
          echo "has_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The release file's version must match version.properties; a
      # mismatch means the release descriptor and committed version
      # metadata diverged, so no release tarball may pack, sign,
      # attest or publish. The snapshot lane does not depend on this
      # job and still publishes the merge's snapshot.
      - name: 'Verify release version matches version.properties'
        id: verify-version
        if: steps.detect.outputs.has_release == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.detect.outputs.version }}
          RESOLVED_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          # Cross-check the release file against version.properties
          if [ "${RELEASE_VERSION}" != "${RESOLVED_VERSION}" ]; then
            echo "::error::Release file version" \
              "(${RELEASE_VERSION}) does not match" \
              "version.properties (${RESOLVED_VERSION})"
            exit 1
          fi
          echo "Release version verified: ${RELEASE_VERSION}"

  release-publish:
    # The leg name comes from the target, so a failed check names the
    # registry that failed rather than leaving the reader to open it.
    name: 'Publish Release (${{ matrix.target.name }})'
    runs-on: ubuntu-latest
    needs:
      - 'check-release'
      - 'resolve-version'
      - 'node-metadata'
      - 'build'
      - 'pack-release'
      - 'attest'
      - 'sign-artefacts'
      - 'resolve-release-targets'
    strategy:
      # One registry rejecting a publish must not abandon the others:
      # the legs are independent destinations for the same artefact,
      # and a partial publish is easier to complete than to redo.
      fail-fast: false
      matrix:
        # yamllint disable-line rule:line-length
        target: ${{ fromJSON(needs.resolve-release-targets.outputs.matrix) }}
    # Publishing waits on attestation and signing so that an enabled
    # record which fails blocks the publish rather than trailing it.
    # Hosted npm repositories are typically write-once, so a version
    # published without its provenance can never be republished to
    # gain it, whereas a blocked publish is simply retryable.
    #
    # Skipped results pass for attest and sign-artefacts, because the
    # attestations/sigstore_sign toggles legitimately disable them.
    #
    # pack-release must now succeed outright. It produces the archive
    # this job publishes through tarball_path, so a skipped or failed
    # pack leaves nothing to publish -- where previously this job
    # packed its own and could carry on. Accepting 'skipped' here
    # would turn that into a download failure deep in the job rather
    # than a clear skip.
    if: >-
      ${{ !cancelled()
      && needs.check-release.result == 'success'
      && needs.check-release.outputs.has_release == 'true'
      && needs.resolve-version.result == 'success'
      && needs.build.result == 'success'
      && needs.resolve-release-targets.result == 'success'
      && needs.pack-release.result == 'success'
      && (needs.attest.result == 'success'
      || needs.attest.result == 'skipped')
      && (needs.sign-artefacts.result == 'success'
      || needs.sign-artefacts.result == 'skipped') }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Publishes use the build job's artefact — the exact tree the
      # build produced — rather than a fresh (unbuilt) checkout, so
      # the job builds nothing and gitignored build output (lib/,
      # dist/) reaches npm publish intact.
      - name: 'Download built project'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: node-build-content
          path: ${{ inputs.path_prefix }}

      # The artefact the attest and sign-artefacts jobs consumed. This
      # job publishes that archive rather than packing a second one,
      # so the bytes the attestation describes are the bytes the
      # registry receives.
      #
      # Where it lands does not matter: npm is given the file by path
      # and packs nothing, so the archive sitting inside the project
      # tree (which it does whenever path_prefix is '.') cannot end up
      # inside a tarball.
      - name: 'Download release tarball'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: node-release-package
          path: pack-dist

      # The release file's version must match version.properties.
      # check-release enforces this and fails the run on a mismatch;
      # this repeats it as defence in depth, since this job writes the
      # version to a registry and the check costs nothing.
      - name: 'Verify release version matches version.properties'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
          RESOLVED_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          # Cross-check the release file against version.properties
          if [ "${RELEASE_VERSION}" != "${RESOLVED_VERSION}" ]; then
            echo "::error::Release file version" \
              "(${RELEASE_VERSION}) does not match" \
              "version.properties (${RESOLVED_VERSION})"
            exit 1
          fi
          echo "Release version verified: ${RELEASE_VERSION}"

      # A live run without credentials fails: this workflow runs on
      # merges, where a missing secret is a misconfiguration, and
      # skipping would leave a green run that published nothing
      # (#120). A dry run needs no credential and never loads one,
      # even when the secrets are set, so a stale grant or a 1Password
      # outage cannot fail a rehearsal (#121).
      - name: 'Check publish credentials'
        id: creds
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          HAS_CREDENTIALS: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' && secrets.VAULT_MAPPING_JSON != '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Gate publishing on credential availability. Dry run
          # first: node-publish-action configures no credential in
          # dry-run mode, so loading one could only add a failure.
          if [ "${DRY_RUN}" = 'true' ]; then
            echo "Dry run: publishing without loading a credential"
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ "${HAS_CREDENTIALS}" = 'true' ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN and/or" \
              "VAULT_MAPPING_JSON unavailable; a live run cannot" \
              "publish without them"
            exit 1
          fi

      - name: 'Resolve Nexus username'
        id: publish-params
        if: steps.creds.outputs.available == 'true'
        shell: bash
        env:
          NEXUS_USER_INPUT: ${{ inputs.nexus_user }}
          # The repository actually checked out/published, which can
          # differ from GITHUB_REPOSITORY for cross-repository calls
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          # 1Password credential naming contract: the credential (and
          # username) take the name of the repository being published
          # (the checked-out repository, not necessarily the caller)
          nexus_user="${NEXUS_USER_INPUT}"
          if [ -z "${nexus_user}" ]; then
            nexus_user="${TARGET_REPOSITORY##*/}"
          fi
          # Constrain to a safe single-line character set before the
          # value reaches $GITHUB_OUTPUT (output-file injection)
          if [[ ! "${nexus_user}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid nexus_user value: ${nexus_user}"
            exit 1
          fi
          echo "nexus_user=${nexus_user}" >> "$GITHUB_OUTPUT"

      # credential_grants_json wires the admin-managed
      # CREDENTIAL_LOAD_GRANTS repository/organisation variable in at
      # the workflow layer: composite actions cannot read vars, and the
      # grants list must never become a caller-facing input.
      # credential-load-action v2+ performs no checkout by default,
      # so the downloaded artefact tree survives this step intact.
      #
      # credential_name lets each target name its own 1Password item,
      # which is what makes several registries workable: a Nexus leg
      # keeps the derived repository name, while a token leg names the
      # item holding that registry's token. Empty keeps the derived
      # name. The grants list still gates which items this repository
      # may load, so naming one here cannot widen access.
      - name: 'Load publish credential'
        id: load-credential
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/credential-load-action@025002b47f4302fb7252175c470da69435060176  # v2.0.4
        with:
          # yamllint disable-line rule:line-length
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault_mapping_json: ${{ secrets.VAULT_MAPPING_JSON }}
          credential_name: ${{ matrix.target.credential_name }}
          credential_grants_json: ${{ vars.CREDENTIAL_LOAD_GRANTS }}
          export_env: 'false'

      # provenance stays false because Nexus npm repositories have no
      # registry-native provenance support. Release-grade provenance
      # comes from the attest and sign-artefacts jobs instead, which
      # cover the packed tarball rather than the registry record.
      #
      # tarball_path is what makes that cover meaningful. Without it
      # the action packs a second archive at publish time, and npm
      # builds the two differently: prepublishOnly runs for publish
      # and not for pack, so a project generating content in that hook
      # ships files the attestation never saw. Handing npm the archive
      # the attest and sign-artefacts jobs consumed makes the attested
      # bytes and the published bytes one object.
      - name: 'Publish release'
        # A dry run publishes nothing and needs no credential, so it
        # runs node-publish-action's dry run even without secrets
        # (#121).
        # yamllint disable-line rule:line-length
        if: steps.creds.outputs.available == 'true' || inputs.dry_run
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/node-publish-action@f16a8028741af0092c72f4a24f6626d9c2afb54b  # v0.2.1
        with:
          publish_version: ${{ needs.resolve-version.outputs.version }}
          registry_url: ${{ matrix.target.registry_url }}
          path_prefix: ${{ inputs.path_prefix }}
          # yamllint disable-line rule:line-length
          tarball_path: pack-dist/${{ needs.pack-release.outputs.tarball_name }}
          node_version: ${{ needs.node-metadata.outputs.node_version }}
          dry_run: ${{ inputs.dry_run }}
          provenance: 'false'
          load_credential: 'false'
          nexus_user: ${{ steps.publish-params.outputs.nexus_user }}
          # One credential is loaded per leg; the target's auth mode
          # decides which input it reaches. node-publish-action treats
          # the modes as mutually exclusive and rejects two at once,
          # so exactly one of these has to be non-empty.
          # yamllint disable-line rule:line-length
          nexus_password: ${{ matrix.target.auth == 'nexus' && steps.load-credential.outputs.credential || '' }}
          # yamllint disable-line rule:line-length
          auth_token: ${{ matrix.target.auth == 'token' && steps.load-credential.outputs.credential || '' }}

  # Pack the release tarball.
  #
  # This job exists because the build job uploads the built *tree*
  # rather than a tarball, and the release version is not stamped at
  # build time. So neither a tarball nor the release version exists in
  # 'node-build-content'. Pack here from that same tree, stamped to
  # the release version.
  #
  # This archive is now the release artefact itself: attest and
  # sign-artefacts cover it, and release-publish hands it to npm
  # through tarball_path rather than packing a second one. One object
  # rather than two that have to be kept identical.
  pack-release:
    name: 'Pack Release Tarball'
    runs-on: ubuntu-latest
    needs:
      - 'node-metadata'
      - 'resolve-version'
      - 'build'
      - 'check-release'
    # Release publishes only; snapshots are replaced on every merge.
    #
    # This job runs for every release publish, not merely when
    # attestations or signing are on. release-publish now publishes
    # this archive through tarball_path rather than packing its own,
    # so the tarball is the release artefact itself and no longer an
    # optional input to attest and sign-artefacts. Gating it on those
    # toggles would leave a caller with both switched off publishing
    # nothing at all.
    #
    # check-release must succeed, not merely report a release: it
    # fails on a version mismatch with version.properties, and its
    # outputs survive that failure. The check lives there, not in
    # this condition, because a version gate here skipped this job,
    # attestation, signing and the publish without failing anything
    # (#118).
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.check-release.result == 'success' && needs.check-release.outputs.has_release == 'true' && needs.resolve-version.result == 'success' && needs.build.result == 'success' }}
    outputs:
      tarball_name: ${{ steps.pack.outputs.tarball_name }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download built project'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: node-build-content
          path: ${{ inputs.path_prefix }}

      # Explicit toolchain setup so the stamp/pack steps run on the
      # resolved Node.js version rather than whatever the runner image
      # happens to carry
      - name: 'Set up Node.js'
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ needs.node-metadata.outputs.node_version }}

      - name: 'Pack release tarball'
        id: pack
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          # Constrain path_prefix to a relative, non-traversing,
          # single-line path before it drives packaging paths
          if [[ ! "${PATH_PREFIX}" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] \
            || [[ "${PATH_PREFIX}" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid path_prefix input: ${PATH_PREFIX}"
            exit 1
          fi
          # resolve-version already validates the version, but this job
          # writes it into a command line and an output, so re-check it
          # rather than trust a value crossing a job boundary
          case "${RELEASE_VERSION}" in
            '' | *[!0-9A-Za-z._-]*)
              echo "::error::Invalid release version: ${RELEASE_VERSION}"
              exit 1
              ;;
          esac
          cd "${PATH_PREFIX}"
          # Stamp the resolved release version so the packed tarball
          # carries the version the publish job publishes.
          #
          # This is now the only stamp in the release path. The action
          # skips its own when given tarball_path, and verifies that
          # this archive already declares publish_version -- so the
          # two can no longer disagree, where previously they had to
          # be kept in step by hand.
          #
          # --ignore-scripts: this job does not install dependencies,
          # so preversion/version/postversion hooks cannot reliably
          # run here.
          #
          # --no-workspaces: with workspaces enabled in configuration,
          # 'npm version' stamps the workspace children and leaves the
          # target at its committed version, and 'npm pack' packs the
          # children instead of the target -- so the release would
          # carry tarballs nobody asked for.
          #
          # The same pair appears in build-test-release.yaml; see #58.
          npm version --no-git-tag-version --allow-same-version \
            --ignore-scripts --no-workspaces "${RELEASE_VERSION}"
          mkdir -p pack-dist
          tarball=$(npm pack --no-workspaces \
            --pack-destination pack-dist | tail -n1)
          if [ ! -f "pack-dist/${tarball}" ]; then
            echo "::error::npm pack produced no tarball"
            exit 1
          fi
          echo "Packed release tarball: ${tarball}"
          echo "tarball_name=${tarball}" >> "$GITHUB_OUTPUT"

      - name: 'Upload release tarball'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: node-release-package
          path: ${{ inputs.path_prefix }}/pack-dist
          retention-days: 45
          # The attest/sign jobs hard-depend on this artefact
          if-no-files-found: error

  # A dedicated job so id-token/attestations grants stay scoped to
  # attestation work and never apply when the toggle is off.
  #
  # Neither this job nor sign-artefacts runs on a dry run: each makes
  # a permanent record -- a GitHub attestation, a public Rekor
  # transparency-log entry -- for a version that never shipped
  # (#121). release-publish already accepts both as skipped.
  attest:
    name: 'Attest Build Provenance'
    runs-on: ubuntu-latest
    needs: 'pack-release'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.pack-release.result == 'success' && inputs.attestations && !inputs.dry_run }}
    permissions:
      contents: read
      id-token: write       # Needed for attestations
      attestations: write   # Needed for attestations
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download release tarball'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: node-release-package
          path: 'attest'

      # SLSA build provenance for the packed tarball. The signer is
      # this reusable workflow, not the caller, so `gh attestation
      # verify` needs --signer-workflow naming merge.yaml, and
      # --source-ref the caller run's GitHub ref: the pushed branch,
      # or the ref a workflow_dispatch targeted, which need not be
      # GERRIT_BRANCH. The README's "Verifying Release Artefacts
      # (Model A)" section shows the form, with
      # build-test-release.yaml in place of merge.yaml.
      #
      # actions/attest rather than actions/attest-build-provenance: as
      # of v4 the latter is a thin wrapper that forwards its inputs to
      # the former, and GitHub directs new implementations to
      # actions/attest. With no predicate supplied it emits SLSA build
      # provenance by default.
      #
      # The wrapper is not quite empty: it also sets
      # NODE_OPTIONS=--max-http-header-size=32768, added upstream for
      # header overflow when pushing attestations to an OCI registry.
      # This job sets no push-to-registry, so that has no bearing here.
      - name: 'Attest build provenance'
        # yamllint disable-line rule:line-length
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          # yamllint disable-line rule:line-length
          subject-path: attest/${{ needs.pack-release.outputs.tarball_name }}

  sign-artefacts:
    name: 'Sign Artefacts'
    runs-on: ubuntu-latest
    needs: 'pack-release'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.pack-release.result == 'success' && inputs.sigstore_sign && !inputs.dry_run }}
    permissions:
      contents: read
      id-token: write  # Sigstore keyless/OIDC signing
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download release tarball'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: node-release-package
          path: 'signing'

      - name: 'Install cosign'
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Keyless signing against the public Sigstore infrastructure.
      # The certificate names this reusable workflow (merge.yaml), so
      # cosign verify-blob needs the identity flags in the README's
      # "Verifying Release Artefacts (Model A)" section, with merge.yaml
      # in the identity regexp, and the caller run's GitHub ref and
      # trigger as the workflow ref and trigger (as for the attest
      # job's --source-ref above).
      - name: 'Sign tarball with Sigstore'
        shell: bash
        env:
          TARBALL: ${{ needs.pack-release.outputs.tarball_name }}
        run: |
          # Sign the release tarball (keyless), emitting a bundle
          cd signing
          cosign sign-blob --yes \
            --bundle "${TARBALL}.sigstore.json" \
            "${TARBALL}"

      - name: 'Upload Sigstore bundle'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: 'sigstore-bundle'
          path: 'signing/*.sigstore.json'
          retention-days: 45
          if-no-files-found: error
