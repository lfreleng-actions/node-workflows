# =============================================================================
# EXAMPLE: Plain GitHub-native caller for the reusable merge workflow
# =============================================================================
# Model B (merge-driven snapshots + releases/ file-triggered releases) is
# PRIMARILY a Gerrit pattern, generalising the Jenkins-heritage LF flow —
# see gerrit.yaml in this directory for the canonical caller. This
# GitHub-native variant serves projects that adopt the same model on a
# plain GitHub repository: every push (merge) to a main branch publishes
# a snapshot, and a merged release file under releases/ triggers a
# release publish.
#
# Copy this file into your project's .github/workflows/ directory (for
# example as merge.yaml) and adjust the `uses:` ref to suit your project.
# =============================================================================
name: 'Merge/Publish'

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
      - master

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  merge:
    name: 'Merge/Publish'
    # The caller's permissions cap what the reusable workflow's jobs
    # can request, so id-token/attestations must be granted here or
    # the attest and sign-artefacts jobs cannot run. Drop them if you
    # set attestations and sigstore_sign to false.
    permissions:
      contents: read
      id-token: write       # OIDC for provenance and Sigstore signing
      attestations: write   # Build provenance attestations
    # REPLACE the pinned SHA below with a node-workflows release SHA.
    # The all-zero SHA is a non-functional placeholder, NOT a real commit.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/node-workflows/.github/workflows/merge.yaml@0000000000000000000000000000000000000000  # REPLACE: vX.Y.Z
    with:
      # REQUIRED: the npm registries receiving publishes.
      #
      # Each target publishes in its own matrix leg, so one registry
      # failing does not abandon the others. 'auth' selects the
      # credential form: 'nexus' for Basic auth, 'token' for a bearer
      # token. registry.npmjs.org rejects Basic auth for publishing.
      #
      # 'credential_name' names the 1Password item holding that
      # registry's credential; omit it to derive the name from the
      # repository. The administrator-managed grants list still
      # controls which items this repository may load.
      snapshot_targets: |
        [
          {"name": "nexus",
           "registry_url":
             "https://nexus3.example.org/repository/npm.snapshot/",
           "auth": "nexus"}
        ]
      #
      # To publish to the public registry as well, replace the whole
      # release_targets value with the two-entry form below. JSON has
      # no comment syntax, so the extra entry cannot be shown inline
      # inside the list:
      #
      #   release_targets: |
      #     [
      #       {"name": "nexus",
      #        "registry_url":
      #          "https://nexus3.example.org/repository/npm.release/",
      #        "auth": "nexus"},
      #       {"name": "npmjs",
      #        "registry_url": "https://registry.npmjs.org/",
      #        "auth": "token",
      #        "credential_name": "example-npmjs-publish-token"}
      #     ]
      release_targets: |
        [
          {"name": "nexus",
           "registry_url":
             "https://nexus3.example.org/repository/npm.release/",
           "auth": "nexus"}
        ]
      # Optional tuning:
      # path_prefix: '.'              # project root (monorepo subdir, etc.)
      # node_version: ''              # override Node.js auto-detection
      # build_tool: ''                # 'npm' or 'yarn'; empty auto-detects
      # harden_runner_egress: 'block' # 'block' (default) or 'audit'
      # attestations: true            # SLSA provenance for releases
      # sigstore_sign: true           # Sigstore bundle for releases
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      VAULT_MAPPING_JSON: ${{ secrets.VAULT_MAPPING_JSON }}
