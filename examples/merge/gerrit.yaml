# =============================================================================
# EXAMPLE: Gerrit-wrapped caller for the reusable merge workflow
# =============================================================================
# Use this form when Gerrit is the source of truth (SCM) for your project.
# gerrit_to_platform dispatches this workflow (via the GitHub API) when a
# change is MERGED in Gerrit (change-merged event).
#
# This is Model B: the MERGE-DRIVEN release model. Every merge publishes
# a snapshot; a release publish triggers when the merged commit adds a
# release file under releases/.
#
# DEPLOYMENT NOTES:
#   * Copy into .github/workflows/ with a filename containing BOTH 'gerrit'
#     AND 'merge' so gerrit_to_platform can discover it, e.g.
#     gerrit-merge.yaml.
#   * The workflow file must exist on EVERY active branch: dispatches
#     target refs/heads/{GERRIT_BRANCH}.
#   * The nine GERRIT_* inputs are populated automatically by the
#     dispatcher. On merge events GERRIT_PATCHSET_NUMBER is hardcoded "1"
#     and GERRIT_REFSPEC is refs/heads/<branch>.
#   * Merge workflows COMMENT on the change (comment-only) — they never
#     vote; the change already merged.
#   * Needs a node-workflows release of v0.7.3 or later. From v0.7.3 the
#     reusable workflow resolves the merged commit from Gerrit rather
#     than the GitHub mirror, so this caller does not wait for
#     replication: a mirror that has not caught up yet cannot change
#     what the run builds. An older release builds the mirror's branch
#     tip, and the run can build the commit before this change.
#   * The report comment reads merge.yaml's outputs, which releases
#     after v0.7.4 provide. Against an older release every output is
#     empty and the comment reports nothing published.
#   * Set the repository variables GERRIT_SERVER, GERRIT_SSH_USER,
#     GERRIT_KNOWN_HOSTS, GERRIT_URL, the secret GERRIT_SSH_PRIVKEY, and
#     (for Nexus publishing) the secrets OP_SERVICE_ACCOUNT_TOKEN and
#     VAULT_MAPPING_JSON.
# =============================================================================
name: 'Gerrit Merge'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: 'Branch that change is against'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_ID:
        description: 'The ID for the change'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_NUMBER:
        description: 'The Gerrit number'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_URL:
        description: 'URL to the change'
        required: false
        type: string
        default: ''
      GERRIT_EVENT_TYPE:
        description: 'Type of Gerrit event'
        required: false
        type: string
        default: ''
      GERRIT_PATCHSET_NUMBER:
        description: 'The patch number for the change'
        required: false
        type: string
        default: ''
      GERRIT_PATCHSET_REVISION:
        description: 'The revision sha'
        required: false
        type: string
        default: ''
      GERRIT_PROJECT:
        description: 'Project in Gerrit'
        required: false
        type: string
        default: ''
      GERRIT_REFSPEC:
        description: 'Gerrit refspec of change'
        required: false
        type: string
        default: ''

# Keyed on the repository, not the change or the branch. Every merge
# publishes the same X.Y.Z-SNAPSHOT version under one dist-tag, so two
# merges running at once race to publish it. Group on the change ID
# and two different changes run side by side. Never cancel a running
# lane, as one stopped mid-publish can leave its targets inconsistent.
# queue: max holds up to 100 pending runs instead of letting a newer
# one replace the one pending. The queue is bounded: once 100 runs
# wait, GitHub cancels each further run, which then neither publishes
# nor reports to Gerrit. Re-run a cancelled run once the queue drains.
#
# Each run builds the commit its change merged as, not the branch tip.
# GitHub starts queued runs in the order they began waiting, which
# mostly but not always matches merge order. If two merges on one
# branch run out of order, the older commit's snapshot publishes last
# and stays the published snapshot until the next merge on that branch
# replaces it; re-run the newer merge's run to restore it sooner. Give
# each active branch its own SNAPSHOT version, or the branch whose run
# finishes last replaces the others' snapshot.
concurrency:
  group: node-merge-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  # Comment on the merged change so the merge pipeline start is visible
  # in Gerrit (comment-only: the change already merged, so no vote).
  notify:
    name: 'Notify Gerrit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: 'Notify merge pipeline start'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@d56b0b5c81402f8cb435aaca513bebdea3be951e  # v1.2.0
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear
          comment-only: 'true'

  # Call the reusable merge workflow, forwarding the Nexus credential
  # secrets it needs once the publish placeholders are replaced.
  merge:
    needs: notify
    if: >-
      always()
      && (needs.notify.result == 'success'
          || needs.notify.result == 'skipped')
    # The caller's permissions cap what the reusable workflow's jobs
    # can request, so id-token/attestations must be granted here or
    # the attest and sign-artefacts jobs cannot run. Drop them if you
    # set attestations and sigstore_sign to false.
    permissions:
      contents: read
      id-token: write       # OIDC for provenance and Sigstore signing
      attestations: write   # Build provenance attestations
    # REPLACE the pinned SHA below with a node-workflows release SHA.
    # The all-zero SHA is a non-functional placeholder, NOT a real commit.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/node-workflows/.github/workflows/merge.yaml@0000000000000000000000000000000000000000  # REPLACE: vX.Y.Z
    with:
      gerrit_refspec: ${{ inputs.GERRIT_REFSPEC }}
      gerrit_project: ${{ inputs.GERRIT_PROJECT }}
      gerrit_branch: ${{ inputs.GERRIT_BRANCH }}
      # Pins the run to the commit that merged this change, however
      # far the branch tip moves before the run resolves it.
      gerrit_patchset_revision: ${{ inputs.GERRIT_PATCHSET_REVISION }}
      # gerrit_url falls back to the GERRIT_URL repository variable.
      # REQUIRED: the npm registries receiving publishes.
      #
      # Each target publishes in its own matrix leg, so one registry
      # failing does not abandon the others. 'auth' selects the
      # credential form: 'nexus' for Basic auth, 'token' for a bearer
      # token. registry.npmjs.org rejects Basic auth for publishing.
      #
      # 'credential_name' names the 1Password item holding that
      # registry's credential; omit it to derive the name from the
      # repository. The administrator-managed grants list still
      # controls which items this repository may load.
      snapshot_targets: |
        [
          {"name": "nexus",
           "registry_url":
             "https://nexus3.example.org/repository/npm.snapshot/",
           "auth": "nexus"}
        ]
      #
      # To publish to the public registry as well, replace the whole
      # release_targets value with the two-entry form below. JSON has
      # no comment syntax, so the extra entry cannot be shown inline
      # inside the list:
      #
      #   release_targets: |
      #     [
      #       {"name": "nexus",
      #        "registry_url":
      #          "https://nexus3.example.org/repository/npm.release/",
      #        "auth": "nexus"},
      #       {"name": "npmjs",
      #        "registry_url": "https://registry.npmjs.org/",
      #        "auth": "token",
      #        "credential_name": "example-npmjs-publish-token"}
      #     ]
      release_targets: |
        [
          {"name": "nexus",
           "registry_url":
             "https://nexus3.example.org/repository/npm.release/",
           "auth": "nexus"}
        ]
      # Optional Node.js tuning; empty values auto-detect from the
      # project metadata:
      # node_version: ''              # override Node.js auto-detection
      # build_node_version: ''        # Node.js for the build job
      # build_tool: ''                # 'npm' or 'yarn'; empty auto-detects
      # attestations: true            # SLSA provenance for releases
      # sigstore_sign: true           # Sigstore bundle for releases
      # Optional environments gating the publish jobs; empty uses none:
      # snapshot_environment: ''
      # release_environment: ''       # e.g. one requiring a reviewer
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      VAULT_MAPPING_JSON: ${{ secrets.VAULT_MAPPING_JSON }}

  # Report the outcome back to Gerrit as a comment (comment-only: merge
  # pipelines never vote). The comment names what the run published,
  # read from merge.yaml's outputs, so a release change that published
  # nothing is plain on the change itself rather than hidden behind a
  # green run. gerrit-review-action writes the status line and run URL,
  # and appends the outcome through its 'message' input (v1.2.0+),
  # which delivers the text verbatim and never through a shell.
  #
  # Every output the message interpolates is still held to a plain
  # character set, and one that fails the check reads as UNAVAILABLE:
  # target names come from the caller's configuration, and a stray
  # control character would make the action refuse the whole comment.
  # Each line is also clipped, so a long target list cannot push the
  # comment past the action's message size cap and lose the report.
  report:
    name: 'Report to Gerrit'
    if: always()
    needs: [notify, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: 'Compose outcome'
        id: compose
        shell: bash
        env:
          RESULT: ${{ needs.merge.result }}
          SNAPSHOT_VERSION: ${{ needs.merge.outputs.snapshot_version }}
          # yamllint disable-line rule:line-length
          SNAPSHOT_PUBLISHED: ${{ needs.merge.outputs.snapshot_published }}
          # yamllint disable-line rule:line-length
          SNAPSHOT_TARGETS: ${{ needs.merge.outputs.snapshot_target_names }}
          HAS_RELEASE: ${{ needs.merge.outputs.has_release }}
          RELEASE_VERSION: ${{ needs.merge.outputs.release_version }}
          RELEASE_PUBLISHED: ${{ needs.merge.outputs.release_published }}
          # yamllint disable-line rule:line-length
          RELEASE_TARGETS: ${{ needs.merge.outputs.release_target_names }}
        run: |
          # Compose the outcome message and the status to report
          safe() {
            if [[ "${1}" =~ ^[A-Za-z0-9.,_\ -]*$ ]]; then
              printf '%s' "${1}"
            else
              printf 'UNAVAILABLE'
            fi
          }
          # gerrit-review-action refuses a message over 4096 bytes, and
          # the publish-targets resolver admits up to 256 targets per
          # lane with names of any length, so a line can outgrow that.
          # Hold each of the two lines to a budget that keeps the pair,
          # newlines included, under the cap. safe() admits single-byte
          # characters only, so ${#1} counts bytes.
          clip() {
            local limit=2000
            if (( ${#1} > limit )); then
              printf '%s...' "${1:0:limit-3}"
            else
              printf '%s' "${1}"
            fi
          }
          snapshot_version=$(safe "${SNAPSHOT_VERSION}")
          snapshot_targets=$(safe "${SNAPSHOT_TARGETS}")
          release_version=$(safe "${RELEASE_VERSION}")
          release_targets=$(safe "${RELEASE_TARGETS}")
          # gerrit-review-action takes success, failure or cancelled
          # for its status line; a merge job that never ran (skipped)
          # or reports anything else counts as a failure.
          case "${RESULT}" in
            success|cancelled) vote_type="${RESULT}" ;;
            *) vote_type='failure' ;;
          esac
          # A 'false' published output means not every target accepted
          # the version. The legs run independently (fail-fast off), so
          # some targets may still hold it: say so rather than claim
          # nothing published.
          if [ "${SNAPSHOT_PUBLISHED}" = 'true' ]; then
            snapshot="Snapshot ${snapshot_version} published to"
            snapshot="${snapshot} ${snapshot_targets}."
          elif [ -n "${snapshot_version}" ]; then
            snapshot="Snapshot ${snapshot_version} NOT confirmed on all"
            snapshot="${snapshot} of ${snapshot_targets:-its targets}."
          else
            snapshot='No snapshot version resolved.'
          fi
          case "${HAS_RELEASE}" in
            true)
              if [ "${RELEASE_PUBLISHED}" = 'true' ]; then
                release="Released ${release_version} to"
                release="${release} ${release_targets}."
              else
                release="Release ${release_version} NOT confirmed on all"
                release="${release} of ${release_targets:-its targets}."
              fi
              ;;
            false) release='No release file, nothing released.' ;;
            *) release='Release check incomplete, nothing released.' ;;
          esac
          printf '%s\n%s\n' "${snapshot}" "${release}"
          # The run log above keeps the full lines; the comment gets
          # the clipped ones. safe() admits no newline, so neither
          # line can end the delimited value early.
          snapshot=$(clip "${snapshot}")
          release=$(clip "${release}")
          {
            echo "vote_type=${vote_type}"
            echo 'message<<GERRIT_REPORT_EOF'
            printf '%s\n%s\n' "${snapshot}" "${release}"
            echo 'GERRIT_REPORT_EOF'
          } >> "${GITHUB_OUTPUT}"
      - name: 'Report outcome'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@d56b0b5c81402f8cb435aaca513bebdea3be951e  # v1.2.0
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: ${{ steps.compose.outputs.vote_type }}
          comment-only: 'true'
          message: ${{ steps.compose.outputs.message }}
